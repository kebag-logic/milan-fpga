[behave]
# @wip marks a scenario that FAILS ON PURPOSE: it is the acceptance test for
# a defect that is filed but not yet fixed, kept executable so the fix has an
# oracle instead of a description. Excluded from the default run so the gate
# stays a true pass/fail on shipped behaviour; run them deliberately with
#   behave --tags=wip
# ONE @wip scenario at present (2026-08-13): the Milan v1.2 Delta 7
# ACQUIRE_ENTITY answer in aecp_response_contract.feature. The AECP uCPU
# answers 0x0000 with the generic NOT_IMPLEMENTED echo instead of
# NOT_SUPPORTED with owner_id zero, and that scenario asserts what Delta 7
# requires, so it is the oracle for the fix. It also carries @open-finding,
# which is what keeps it out of the `behave --tags ~@open-finding` gate.
# The two that carried the tag before lived in aecp_stack_lock_acquire.feature
# / aecp_stack_descriptor_walk.feature, deleted with hdl/ieee17221/aecp/** on
# 2026-08-12.
default_tags = -wip
