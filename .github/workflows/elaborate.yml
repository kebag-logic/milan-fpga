      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Cache exact Python downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python-cpython3.12.3-${{ hashFiles('ci/constraints-ci.txt', 'tools/*/requirements.txt',
            'sw/litex/litex_pins.txt') }}-${{ hashFiles('scripts/ci_install*.py', '.github/workflows/*.yml')
            }}-${{ runner.os }}
        id: ci_step_2
      - name: Decide whether this head needs an elaboration
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # ci_scope.py arrives with PR #176. Until that lands this file may
          # not exist, and the safe answer to "is this change RTL relevant"
          # when the classifier is absent is yes.
          if [ ! -f scripts/ci_scope.py ]; then
            echo "rtl=true" >> "$GITHUB_OUTPUT"
            echo "no scripts/ci_scope.py yet: elaborating unconditionally"
            exit 0
          fi
          python3 scripts/ci_scope.py --selftest
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "rtl=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${ACT:-false}" = true ]; then
            # Replay uses the live base fetched and verified by the runner.
            base="$(git merge-base --all "refs/remotes/origin/$PR_BASE_REF" "$PR_HEAD_SHA")"
            git cat-file -e "$base^{commit}"
            merged="$(git merge-tree --write-tree "refs/remotes/origin/$PR_BASE_REF" "$PR_HEAD_SHA")"
            git diff --no-renames --name-only "refs/remotes/origin/$PR_BASE_REF" "$merged" \
              > "$RUNNER_TEMP/changed"
          else
            git diff --no-renames --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" \
              > "$RUNNER_TEMP/changed"
          fi
          echo "rtl=$(python3 scripts/ci_scope.py < "$RUNNER_TEMP/changed")" >> "$GITHUB_OUTPUT"
      - name: Fetch the source dependencies the elaboration reads
        if: ${{ steps.scope.outputs.rtl == 'true' }}
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor
        id: ci_step_4
      - name: Cache verified sv2v archive
        uses: actions/cache@v4
        with:
