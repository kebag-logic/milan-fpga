      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Cache exact Python downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python-cpython3.12.3-${{ hashFiles('ci/constraints-ci.txt', 'tools/*/requirements.txt',
            'sw/litex/litex_pins.txt') }}-${{ hashFiles('scripts/ci_install*.py', '.github/workflows/*.yml')
            }}-${{ runner.os }}
        id: ci_step_2
      - name: Cache pinned evidence reader downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pyyaml-6.0.2-d584d9ec91ad65861cc08d42e834324ef890a082e591037abe114850ff7bbc3e-${{ hashFiles('ci/requirements-evidence.txt',
            'scripts/ci_runtime_workflows.py', 'scripts/ci_gate_workflows.py', '.github/workflows/*.yml')
            }}-${{ runner.os }}
        id: ci_step_3
      - name: Install the pinned evidence reader
        run: |
          python3 -m pip install --quiet --require-hashes --no-deps -r ci/requirements-evidence.txt
        id: ci_step_4
      - name: Download executed gate outcomes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gate-elaborate-*-${{ github.sha }}
          path: ${{ runner.temp }}/gate-results
        id: ci_step_5
      - name: Require every gate exactly once
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci_gate_receipts.py verify --workflow elaborate --root "$RUNNER_TEMP/gate-results" --head "$GITHUB_SHA" --output "$RUNNER_TEMP/gate-union.json"
        id: ci_step_6
      - name: Upload verified gate union
        uses: actions/upload-artifact@v4
        with:
          name: gate-union-elaborate-${{ github.sha }}
          path: ${{ runner.temp }}/gate-union.json
          if-no-files-found: error
        id: ci_step_7
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/elaborate.yml --job elaborate --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-elaborate-elaborate-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/ci/constraints-ci.txt
  ci-manifest:
    name: Collect CI manifest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    needs:
      - elaborate-gates-0
      - elaborate-gates-1
      - elaborate
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
      - name: Fetch inventory dependencies
        run: |
          git submodule update --init third_party/verilog-axis protocol-processor gptp-processor third_party/tsn-c-stack
      - name: Cache pinned evidence reader downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pyyaml-6.0.2-d584d9ec91ad65861cc08d42e834324ef890a082e591037abe114850ff7bbc3e-${{ hashFiles('ci/requirements-evidence.txt',
            'scripts/ci_runtime_workflows.py', 'scripts/ci_gate_workflows.py', '.github/workflows/*.yml')
            }}-${{ runner.os }}
      - name: Install the pinned evidence reader
        run: |
          python3 -m pip install --quiet --require-hashes --no-deps -r ci/requirements-evidence.txt
      - name: Download completed execution artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/manifest-inputs
      - name: Collect actual runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_runtime_evidence.py collect --run "$GITHUB_RUN_ID" --artifacts "$RUNNER_TEMP/manifest-inputs" --output "$RUNNER_TEMP/ci-manifest.json"
      - name: Upload canonical CI manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-manifest-elaborate-${{ github.sha }}
          path: ${{ runner.temp }}/ci-manifest.json
          if-no-files-found: error
          retention-days: 3
  ci-fail-fast:
    name: Fail fast across this head
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository) }}
    permissions:
      contents: read
      actions: write
    outputs:
      observer_only_error: ${{ steps.ci_observe.outputs.observer_error == 'true' && steps.ci_record.outcome
        == 'success' && steps.ci_upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Observe the first failed job
        id: ci_observe
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOBS: '["Collect CI manifest","elaborate","elaborate-gates-0","elaborate-gates-1"]'
          SKIPPED_MATRICES: '{}'
        run: |
          python3 scripts/ci_fail_fast.py watch
      - name: Cancel this run and sibling workflows
        if: ${{ failure() && steps.ci_observe.outputs.observer_error != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_fail_fast.py cancel
        id: ci_step_3
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/elaborate.yml --job ci-fail-fast --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-elaborate-ci-fail-fast-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
  ci-cancel-tail:
    name: Cancel late CI failures
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository)) }}
    needs:
      - ci-fail-fast
      - ci-manifest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
      - name: Cancel confirmed terminal failures
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TAIL_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci_fail_fast.py tail
'on':
  push:
    branches:
      - main
      - dev
  pull_request: null
  workflow_dispatch: null
