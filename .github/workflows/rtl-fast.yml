          FIRMWARE_UNIT_RESULT: ${{ needs.firmware-unit.result }}
          FIRMWARE_CONTROL_MUTANTS_RESULT: ${{ needs.firmware-control-mutants.result }}
          FIRMWARE_AECP_MUTANTS_RESULT: ${{ needs.firmware-aecp-mutants.result }}
          FIRMWARE_SRP_MUTANTS_RESULT: ${{ needs.firmware-srp-mutants.result }}
          FIRMWARE_BOUNDARY_RESULT: ${{ needs.firmware-boundary.result }}
          FIRMWARE_VERILATOR_RESULT: ${{ needs.firmware-verilator.result }}
        run: |
          set -euo pipefail
          bad=0
          for pair in \
            "changes:$CHANGES_RESULT" \
            "verilator-lint:$VERILATOR_LINT_RESULT" \
            "bdd-conformance:$BDD_CONFORMANCE_RESULT" \
            "yosys-elaboration:$YOSYS_ELABORATION_RESULT" \
            "publication-census:$PUBLICATION_CENSUS_RESULT" \
            "firmware-unit:$FIRMWARE_UNIT_RESULT" \
            "firmware-control-mutants:$FIRMWARE_CONTROL_MUTANTS_RESULT" \
            "firmware-aecp-mutants:$FIRMWARE_AECP_MUTANTS_RESULT" \
            "firmware-srp-mutants:$FIRMWARE_SRP_MUTANTS_RESULT" \
            "firmware-boundary:$FIRMWARE_BOUNDARY_RESULT" \
            "firmware-verilator:$FIRMWARE_VERILATOR_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            printf '%-24s %s\n' "$name" "$result"
            case "$result" in
              success|skipped) ;;
              *) bad=1 ;;
            esac
          done
          [ "$bad" -eq 0 ]
        id: ci_step_1
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl-fast.yml --job rtl-fast --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-fast-rtl-fast-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
  ci-fail-fast:
    name: Fail fast across this head
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository) }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Observe the first failed job
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOBS: '["bdd-conformance","changes","firmware-aecp-mutants","firmware-boundary","firmware-control-mutants","firmware-srp-mutants","firmware-unit","firmware-verilator","publication-census","rtl-fast","verilator-lint","yosys-elaboration"]'
        run: |
          python3 scripts/ci_fail_fast.py watch
        id: ci_step_1
      - name: Cancel this run and sibling workflows
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_fail_fast.py cancel
        id: ci_step_2
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl-fast.yml --job ci-fail-fast --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-fast-ci-fail-fast-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
  ci-manifest:
    name: Collect CI manifest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    needs:
      - changes
      - verilator-lint
      - bdd-conformance
      - yosys-elaboration
      - publication-census
      - firmware-unit
      - firmware-control-mutants
      - firmware-aecp-mutants
      - firmware-srp-mutants
      - firmware-boundary
      - firmware-verilator
      - rtl-fast
      - ci-fail-fast
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache pinned evidence reader downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pyyaml-6.0.2-d584d9ec91ad65861cc08d42e834324ef890a082e591037abe114850ff7bbc3e-${{ hashFiles('ci/requirements-evidence.txt',
            'scripts/ci_runtime_workflows.py', 'scripts/ci_gate_workflows.py', '.github/workflows/*.yml')
            }}-${{ runner.os }}
      - name: Install the pinned evidence reader
        run: |
          python3 -m pip install --quiet --require-hashes --no-deps -r ci/requirements-evidence.txt
      - name: Download completed execution artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/manifest-inputs
      - name: Collect actual runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_runtime_evidence.py collect --run "$GITHUB_RUN_ID" --artifacts "$RUNNER_TEMP/manifest-inputs" --output "$RUNNER_TEMP/ci-manifest.json"
      - name: Upload canonical CI manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-manifest-rtl-fast-${{ github.sha }}
          path: ${{ runner.temp }}/ci-manifest.json
          if-no-files-found: error
          retention-days: 3
'on':
  push:
    branches:
      - dev
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
