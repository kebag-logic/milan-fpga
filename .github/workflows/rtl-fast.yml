# Generated by scripts/ci_gate_workflows.py from .github/ci-templates/rtl-fast.yml.
# Edit the template and regenerate; original commands remain contract-checked.
name: rtl-fast
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  VERILATOR_VERSION: v5.050
  YOSYS_VERSION: v0.66
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rtl: ${{ steps.scope.outputs.rtl }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Classify the change conservatively
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/ci_scope.py --selftest

          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "${ACT:-false}" = true ]; then
              # Replay uses the live base fetched and verified by the runner.
              base="$(git merge-base --all "refs/remotes/origin/$PR_BASE_REF" "$PR_HEAD_SHA")"
              git cat-file -e "$base^{commit}"
              merged="$(git merge-tree --write-tree "refs/remotes/origin/$PR_BASE_REF" "$PR_HEAD_SHA")"
              git diff --no-renames --name-only "refs/remotes/origin/$PR_BASE_REF" "$merged" \
                > "$RUNNER_TEMP/changed-files"
            else
              git diff --no-renames --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" \
                > "$RUNNER_TEMP/changed-files"
            fi
          else
            base="$PUSH_BEFORE_SHA"
            if [ -n "$base" ] \
               && [ "$base" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --no-renames --name-only "$base" "$GITHUB_SHA" \
                > "$RUNNER_TEMP/changed-files"
            else
              # An unknown base must never turn a real change into docs-only.
              git ls-files > "$RUNNER_TEMP/changed-files"
            fi
          fi

          echo "Changed files:"
          sed 's/^/  /' "$RUNNER_TEMP/changed-files"
          rtl="$(python3 scripts/ci_scope.py < "$RUNNER_TEMP/changed-files")"
          echo "rtl=$rtl" >> "$GITHUB_OUTPUT"
          echo "RTL/tooling relevant: $rtl"
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl-fast.yml --job changes --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-fast-changes-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
  verilator-lint:
    needs: changes
    if: ${{ needs.changes.outputs.rtl == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Fetch RTL dependencies
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor
        id: ci_step_1
      - name: Cache the pinned Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-848d926ebd4addacacd294dc84e35d9d4ae8078c-${{ hashFiles('.github/workflows/*.yml')
            }}-${{ runner.os }}
      - name: Resolve exact package downloads 3
        id: ci_packages_3
        run: |
          python3 scripts/ci_install_cache.py --packages autoconf bison flex g++ git help2man libfl-dev libfl2 make perl python3 --recipe 75d476c3189fef71fc03124453eee7a9c57cb835618ddc3b4c8dfdd159da7cb8 --directory "$RUNNER_TEMP/ci_packages_3" --output "$GITHUB_OUTPUT"
        if: ${{ steps.cache-verilator.outputs.cache-hit != 'true' }}
      - name: Cache exact package downloads 3
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci_packages_3
          key: ${{ runner.os }}-${{ steps.ci_packages_3.outputs.key }}-${{ hashFiles('scripts/ci_install*.py',
            '.github/workflows/*.yml') }}
        if: ${{ steps.cache-verilator.outputs.cache-hit != 'true' }}
        id: ci_step_4
      - name: Build Verilator from source on cache miss
        if: ${{ steps.cache-verilator.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          : # package index prepared above
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/ci_packages_3" install -y --no-install-recommends \
            git make autoconf g++ flex bison libfl2 libfl-dev help2man perl python3
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git /tmp/verilator-src
          cd /tmp/verilator-src
          test "$(git rev-parse HEAD)" = "848d926ebd4addacacd294dc84e35d9d4ae8078c"
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          sudo make install
        id: ci_step_5
      - name: Run the ratcheted whole-tree lint gate
        run: |
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
