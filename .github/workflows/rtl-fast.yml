          PATH="/opt/verilator/bin:$PATH" \
            python3 scripts/lint_rtl.py --check --self-test
        id: ci_step_6
      - name: Prove protocol-processor source lists are derived
        run: python3 scripts/pp_srcs.py --check --selftest
        id: ci_step_7
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl-fast.yml --job verilator-lint --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-fast-verilator-lint-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
