name: docs
jobs:
  wire-accountability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          tool_build=$(( cpus < 8 ? cpus : 8 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_TOOL_BUILD_JOBS=%s\n' "$tool_build"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Cache exact Python downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python-cpython3.12.3-${{ hashFiles('ci/constraints-ci.txt', 'tools/*/requirements.txt',
            'sw/litex/litex_pins.txt') }}-${{ hashFiles('scripts/ci_install*.py', '.github/workflows/*.yml')
            }}-${{ runner.os }}
        id: ci_step_2
      - name: Fetch the engine authority the builder derives from
        run: git submodule update --init gptp-processor
        id: ci_step_3
      - name: Advertised-vs-emitted gate (green since 2026-07-28, item 00)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_wire_accountability.py --self-test
        id: ci_step_4
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/docs.yml --job wire-accountability --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-docs-wire-accountability-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/ci/constraints-ci.txt
