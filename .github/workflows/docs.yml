          if-no-files-found: error
          retention-days: 3
  ci-cancel-tail:
    name: Cancel late CI failures
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository)) }}
    needs:
      - ci-fail-fast
      - ci-manifest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
