name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      # No submodules on purpose: all three gates below are pure Python and must
      # keep working for someone who only has the repo (see QUICKSTART.md).
      - uses: actions/checkout@v4
      - name: Link health, wording, dead-reference and local-info gate
        run: python3 scripts/docs_check.py
      - name: Traceability matrix no-drift gate
        run: python3 docs/traceability/gen_module_matrix.py --check
      - name: End-station builder gates
        run: |
          python3 -m pip install --quiet pyyaml
          python3 sw/builder/test_builder.py
      - name: SoC source-list gate (Vivado would fail 40 min in without this)
        run: python3 scripts/check_soc_sources.py

      # Cited-path gate: a backticked `hdl/...` in prose is the first thing a
      # reader follows and nothing else links it to the tree. Two tree-wide
      # moves left 33 citations pointing at directories that do not exist.
      - name: Doc cited-path gate
        run: python3 scripts/check_doc_paths.py

      # Archive gate: obsolete docs are ARCHIVED, never deleted (USER rule), so
      # an archived page must stay labelled and reachable - a banner, one index
      # row, and a successor that still exists. Renaming one living doc broke
      # six forward pointers at once in testing.
      - name: Archive integrity gate
        run: python3 scripts/check_archive.py

      # Contents gate: every page of 3+ sections carries an annotated contents
      # list, its entries match the headings that exist, and no entry is left
      # as a TODO placeholder. Renaming a heading DROPS its description rather
      # than carrying a stale sentence forward, so this fails until someone
      # writes a fresh one - which is the point.
      - name: Per-page contents gate
        run: |
          python3 scripts/gen_toc.py --verify-anchors
          python3 scripts/gen_toc.py --check

      # Build-shape gate: the milan_soc.py command line sweep.sh/build.sh compose
      # must equal the end-station config they claim to build (--num-streams,
      # --rx-queues, --l2-bytes). --self-test also proves a wrong value IS rejected.
      - name: Sweep/build shape gate
        run: python3 scripts/check_sweep_shape.py --self-test

      # Advertised-shape gate: the ADPDU stream counts (milan_csr 0x618/0x61C),
      # the AEM STREAM_INPUT/STREAM_OUTPUT descriptor counts and the ACMP
      # context counts the gateware elaborates must be the SAME number. They
      # were three different numbers on silicon 2026-07-27 because 0x618/0x61C
      # were RW registers filled in by a boot script frozen at the 1x1 shape.
      # --self-test also proves a disagreeing shape IS rejected.
      - name: Entity shape gate
        run: python3 scripts/check_entity_shape.py --self-test

      # DT binding gate: negative controls for the kl,dma-ether / kl,milan-pcm
      # binding checker (a checker that cannot fail is not a gate).
      - name: Device-tree binding gate
        run: python3 sw/dts/milan_dt.py selftest

  # ==========================================================================
  #  THIS JOB IS EXPECTED TO BE RED (roadmap item 00). Read before "fixing" it.
  #
  #  Every gate in the job above compares a declaration against ANOTHER
  #  declaration and none of them can see the wire, which is how the 8x8
  #  talkers came to advertise 8-channel AAF while the framer emits stereo with
  #  57/57 suites and 2,062,389 checks green. A Milan-validated reference
  #  device caught it: ACMP SUCCESS, Milan 5.5.1.2 format check passed, then
  #  UNSUPPORTED_FORMAT on 296,294 of 296,294 frames.
  #
  #  The deviation used to be a prose comment in the config, and a comment does
  #  not fail a build. This job is that comment turned into an exit code, and
  #  it goes green when the FRAMER is raised (roadmap item 5) - never by
  #  lowering a declared format, which was tried on 2026-07-27 (dade536) and
  #  reverted (e103d8e) because it would ship an 8x8 board advertising itself
  #  as stereo forever.
  #
  #  It is a SEPARATE job on purpose: a known-red step inside docs-check would
  #  mask the first real regression in any of the gates above it.
  # ==========================================================================
  wire-accountability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advertised-vs-emitted gate (expected red until roadmap item 5)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_wire_accountability.py --self-test

  # The same docs gate with no git metadata at all - proves it still runs in an
  # extracted tarball or a downloaded zip, which is how most outsiders will
  # first meet this repo.
  docs-check-no-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip git metadata, then run the docs gate
        run: |
          rm -rf .git
          python3 scripts/docs_check.py
