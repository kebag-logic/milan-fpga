name: docs

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      # The documentation-only gates run before any submodule checkout. The
      # builder gates below consume the pinned processor image tools and expand
      # the Vivado datapath manifest through verilog-axis's source inventory.
      - uses: actions/checkout@v4
      # pyyaml is load-bearing for the bare-metal-only gate below (it REFUSES
      # to run without it) and for three later gates, so it is installed here
      # rather than in the middle of the job.
      - name: Install the python gate dependencies
        run: python3 -m pip install --quiet pyyaml
      - name: Link health, wording, dead-reference and local-info gate
        run: python3 scripts/docs_check.py
      - name: Milan feature-status consistency gate
        run: python3 scripts/check_feature_status.py --self-test
      - name: Traceability matrix no-drift gate
        run: python3 docs/traceability/gen_module_matrix.py --check
      - name: Fetch the builder source dependencies
        # gptp-processor rides along for the SoC source-list gate: since it
        # polices submodule-rooted entries, the files must exist to be judged
        # present rather than STALE. The builder's dp_srcs.py self-test also
        # resolves the five verilog-axis leaves in the shipping OOC manifest.
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor
      # Code-quality measurement self-tests (Rules 1 and 2 of
      # docs/development/CODE_QUALITY.md): the fixture arms of the two tools
      # the guide quotes its numbers from. Each arm fails when the defect it
      # guards is reintroduced - an exclusive case arm read as source-order
      # priority, an elif read as a nesting level, a `<=` comparison read as
      # a write - and the population arm refuses a scan that reaches neither
      # processor's Python, so it needs the submodule checkout above.
      - name: Code-quality measurement self-tests
        run: |
          python3 scripts/measure_control_flow.py --selftest
          python3 scripts/measure_cohesion.py --selftest
      # dp_srcs.py refuses to answer without a front end (no model may stand
      # in for sv2v), and the builder runs its self-test unconditionally, so
      # this job needs the same pinned release the portability gate uses.
      # The absent-tool refusal itself stays: a host without sv2v still gets
      # a named refusal, never a silent pass.
      - name: Install the pinned sv2v release
        run: |
          set -euo pipefail
          ver=v0.0.12
          url="https://github.com/zachjs/sv2v/releases/download/${ver}/sv2v-Linux.zip"
          curl -fsSL "$url" -o /tmp/sv2v.zip
          unzip -q -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m755 "$(find /tmp/sv2v -name sv2v -type f | head -1)" \
            /usr/local/bin/sv2v
          sv2v --version
      # The focused bare-metal-only scope gate (#259 / PR #228): the lane's
      # owned surface must not reacquire a retired host-stack product claim.
      - name: Bare-metal scope gate
        run: |
          python3 scripts/check_baremetal_only.py --check
          python3 scripts/check_baremetal_only.py --selftest
      - name: End-station builder gates
        run: |
          python3 -m pip install --quiet pyyaml
          python3 sw/builder/test_builder.py
      # NVM record-space gate (#70): the persisted set has TWO capacities, the
      # erase block and the port's record_id[7:0]. Only the first was ever
      # checked, and the second overflows at 8x8 (292 records against 256 ids).
      # The gate also ENCODES the KLJ2 image and decodes it back, because three
      # review rounds running found the same class of hole in a check that
      # reasoned about the set as counts rather than bytes. --self-test runs
      # seventeen negative controls and fails if any of them passes, so no
      # assertion here can quietly become vacuous. Placed after the builder
      # gates: it needs pyyaml and the processor submodule, which both steps
      # above provide.
      - name: NVM record-space gate
        run: |
          python3 scripts/check_nvm_record_space.py
          python3 scripts/check_nvm_record_space.py --self-test
      - name: SoC source-list gate (Vivado would fail 40 min in without this)
        run: |
          python3 scripts/check_soc_sources.py
          python3 scripts/check_soc_sources.py --selftest

      # The other four lists of the same RTL. check_soc_sources.py guards the
      # Vivado one; this gate derives the whole milan_datapath file closure
      # from the RTL and checks every consumer against it, asking each one for
      # its own expansion rather than parsing it. Placed here because it needs
      # the same submodules the builder steps above check out. A consumer that
      # cannot answer FAILS the gate (exit 2): this job runs the strict default
      # and never passes --allow-skip, the tool-less-host opt-out that prints a
      # loud SKIPPED marker instead of a verdict that covers it.
      # It also reads the protocol processor's own Yosys tops array against the
      # modules that processor declares (scripts/processor_yosys_tops.budget).
      - name: RTL source-list drift gate
        run: |
          python3 scripts/check_rtl_source_lists.py
          python3 scripts/check_rtl_source_lists.py --selftest

      # CI event and SHA contract gate (#174, #181): the four workflow files
      # and docs/testing/CI_WORKFLOWS.md must agree on the triggers, the cron
      # time, the public check names, cancel-in-progress and the one-SHA rule
      # (no checkout overrides `ref`; workers record it, aggregates verify it).
      # --selftest mutates each item on in-memory copies and requires a
      # finding for each. Placed after the builder gates, which install pyyaml.
      - name: CI event and SHA contract gate
        run: |
          python3 scripts/ci_events.py --check
          python3 scripts/ci_events.py --selftest

      # The local Actions runner is the required first response to a pending
      # hosted run (#268). Its offline self-test holds exact-head refusals,
      # trusted submodule manifests, Docker ownership selection, event
      # construction, workflow selection and secret-free commands without
      # requiring Docker inside this job. The CI contract gate above pins this
      # step and mutates its deletion/neutering. The live interruption gate is
      # local.
      - name: Local act runner contract gate
        run: python3 scripts/act_ci.py --selftest

      # Cited-path gate: a backticked `hdl/...` in prose is the first thing a
      # reader follows and nothing else links it to the tree. Two tree-wide
      # moves left 33 citations pointing at directories that do not exist.
      - name: Doc cited-path gate
        run: python3 scripts/check_doc_paths.py

      # Archive gate: obsolete docs are ARCHIVED, never deleted (USER rule), so
      # an archived page must stay labelled and reachable - a banner, one index
      # row, and a successor that still exists. Renaming one living doc broke
      # six forward pointers at once in testing.
      - name: Archive integrity gate
        run: python3 scripts/check_archive.py

      # Contents gate: every page of 3+ sections carries an annotated contents
      # list, its entries match the headings that exist, and no entry is left
      # as a TODO placeholder. Renaming a heading DROPS its description rather
      # than carrying a stale sentence forward, so this fails until someone
      # writes a fresh one - which is the point.
      - name: Per-page contents gate
        run: |
          python3 scripts/gen_toc.py --verify-anchors
          python3 scripts/gen_toc.py --check

      # Build-shape gate: the milan_soc.py command line sweep.sh/build.sh compose
      # must equal the end-station config they claim to build (--num-streams,
      # --rx-queues, --l2-bytes). --self-test also proves a wrong value IS rejected.
      - name: Sweep/build shape gate
        run: python3 scripts/check_sweep_shape.py --self-test

      # Advertised-shape gate: the ADPDU stream counts (milan_csr 0x618/0x61C),
      # the AEM STREAM_INPUT/STREAM_OUTPUT descriptor counts and the ACMP
      # context counts the gateware elaborates must be the SAME number. They
      # were three different numbers on silicon 2026-07-27 because 0x618/0x61C
      # were RW registers filled in by a boot script frozen at the 1x1 shape.
      # --self-test also proves a disagreeing shape IS rejected.
      - name: Entity shape gate
        run: python3 scripts/check_entity_shape.py --self-test


  # ==========================================================================
  #  THIS JOB WENT GREEN 2026-07-28 AND MUST STAY GREEN (roadmap item 00).
  #
  #  It was born EXPECTED-RED: every other gate compares a declaration against
  #  ANOTHER declaration and none can see the wire, which is how the 8x8
  #  talkers came to advertise 8-channel AAF while the framer emitted stereo
  #  with 57/57 suites green - a Milan-validated reference device caught it at
  #  UNSUPPORTED_FORMAT on 296,294 of 296,294 frames. This job was that prose
  #  deviation turned into an exit code, red by design and owned by item 5.
  #
  #  It went green the specified way, in two halves: the TDM MASTER raised the
  #  framer to the declaration (W1, never the reverse - the dade536
  #  down-declaration was reverted), and KL_pair_zero_fill made every BOUND
  #  talker frame at the media rate, silence where no source feeds it (Milan
  #  v1.2 5.3.7.3, W5). Source coverage stays a printed [note], not a finding.
  #
  #  A failure here now is a REGRESSION of one of those two closures, or a new
  #  advertised width the fabric cannot back. It stays a SEPARATE job so its
  #  history keeps reading as the item-00 record.
  # ==========================================================================
  wire-accountability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the engine authority the builder derives from
        run: git submodule update --init gptp-processor
      - name: Advertised-vs-emitted gate (green since 2026-07-28, item 00)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_wire_accountability.py --self-test

  # The same docs gate with no git metadata at all - proves it still runs in an
  # extracted tarball or a downloaded zip, which is how most outsiders will
  # first meet this repo.
  docs-check-no-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip git metadata, then run the docs gate
        run: |
          rm -rf .git
          python3 scripts/docs_check.py
          python3 scripts/check_feature_status.py
