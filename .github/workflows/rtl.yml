name: rtl

on:
  push:
    branches: [main]
  pull_request:

# A newer commit makes an older run irrelevant. Free its four hosted runners
# immediately instead of making the useful run queue behind stale evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version the harnesses are developed and gated against.
  # Distro Verilator is NOT usable here - see docs/testing/TESTING.md §7:
  #   5.020 (Ubuntu 24.04)  cannot BUILD the datapath harnesses at all
  #                         (BLKLOOPINIT on legal SystemVerilog).
  #   5.032 (Debian trixie) builds, but read back 0 on 6 checks of the AECP
  #                         suite of the day (that suite is gone with the
  #                         1722.1 plane; the version defect it exposed is not).
  # Both measured. Bump this pin deliberately, never incidentally.
  VERILATOR_VERSION: v5.050
  # The tsn_fuzz suite is a required field campaign. Pin its packet generator
  # so suite accounting never degrades to an uncounted local-only skip.
  TSN_GEN_REV: fde652067d3618f47fba2c2e8eb05f6c9f6fa97f

jobs:
  # The full Verilator suite sweep needs verilog-axis and protocol-processor.
  # Both use anonymous HTTPS so a fork can fetch them too.
  verilator-shards:
    name: Verilator shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the RTL submodules
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor

      - name: Cache the pinned Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Build Verilator from source (cache miss only)
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make autoconf g++ flex bison libfl2 libfl-dev help2man perl python3
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git /tmp/verilator-src
          cd /tmp/verilator-src
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          sudo make install

      - name: Put Verilator on PATH and prove the version
        run: |
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
          /opt/verilator/bin/verilator --version

      # RTL lint, BEFORE the 100-minute sweep so a lint break is a ~1 min
      # verdict rather than something you wait an hour to be told. It is a STEP
      # and not its own job on purpose: it needs exactly this Verilator, at
      # exactly this pin, and a separate job would either restore the same
      # cache twice or - on a cache miss - build Verilator twice in parallel
      # for a check that runs in nine seconds.
      #   * --check fails on a NEW violation (per-directory ratchet in
      #     scripts/lint.budget); today's 188 are grandfathered and printed.
      #   * --self-test proves the malformed-pragma gate still bites, which is
      #     never ratcheted: `lint_off CODE // prose` builds under 5.050 and
      #     does NOT build under 5.020.
      - name: RTL lint (whole hdl/, ratcheted)
        run: python3 scripts/lint_rtl.py --check --self-test

      # Every build input derives the submodule source list rather than listing
      # it. This gate is the backstop against a literal coming back: a new
      # consumer, or a derivation reverted to a hand-written list. It cannot
      # catch a stale copy that no longer exists, which is the point -- it
      # catches the copy being re-created.
      - name: Submodule source list is derived, not copied
        run: python3 scripts/pp_srcs.py --check --selftest

      # The chmap_capture lane's netcheck leg synthesizes KL_chan_map_capture
      # with yosys and re-simulates the netlist, which is how the VERSION
      # 0x0030 class of hazard is pinned: RTL green while synthesized silicon
      # shifted the map-write indexing. Without yosys on PATH that leg dies
      # with exit 127 AFTER its own 184 checks have already passed, so the
      # sweep reports a failing suite whose log says zero failures.
      #
      # sv2v comes too, and is not optional: the leg lowers the module to
      # Verilog-2005 first, because the yosys Ubuntu ships (0.33) cannot
      # parse the SystemVerilog size casts this file uses. Same pin as the
      # yosys-portability job below, which already lowers this exact module.
      - name: Install yosys for the netlist-level suite legs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V

      - name: Install sv2v from the upstream release
        run: |
          set -eu
          ver=v0.0.12
          url="https://github.com/zachjs/sv2v/releases/download/${ver}/sv2v-Linux.zip"
          curl -fsSL "$url" -o /tmp/sv2v.zip
          unzip -q -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m755 "$(find /tmp/sv2v -name sv2v -type f | head -1)" /usr/local/bin/sv2v
          sv2v --version

      - name: Build the pinned tsn-gen field oracle
        run: |
          set -eu
          git clone --filter=blob:none \
            https://github.com/kebag-logic/tsn-gen.git "$RUNNER_TEMP/tsn-gen"
          git -C "$RUNNER_TEMP/tsn-gen" checkout "$TSN_GEN_REV"
          git -C "$RUNNER_TEMP/tsn-gen" submodule update \
            --init --depth 1 --recursive external/rapidyaml
          cmake -S "$RUNNER_TEMP/tsn-gen" -B "$RUNNER_TEMP/tsn-gen/build" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_PARSER_TESTS=OFF
          cmake --build "$RUNNER_TEMP/tsn-gen/build" \
            --target packet_gen --parallel
          test -x "$RUNNER_TEMP/tsn-gen/build/traffic-gen/packet_gen"
          echo "TSN_GEN_ROOT=$RUNNER_TEMP/tsn-gen" >> "$GITHUB_ENV"

      - name: Run this suite shard
        run: scripts/run_all_suites.sh "$RUNNER_TEMP/suite-logs" --shard "${{ matrix.shard }}/4"

      # Always upload: the final required check proves that the four artifacts
      # are an exhaustive, disjoint copy of the serial suite inventory.
      - name: Upload this shard's suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/suite-logs
          if-no-files-found: error
          retention-days: 3

  # Preserve the public required-check name while moving the expensive work to
  # four isolated workers. This job fails if any worker failed OR if their logs
  # omit, duplicate, or invent a suite relative to tb/verilator/.
  verilator-suites:
    name: verilator-suites
    # Still aggregate ordinary worker failures, but let concurrency cancellation
    # stop the obsolete run instead of keeping it alive for this bookkeeping.
    if: ${{ !cancelled() }}
    needs: verilator-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download every shard's logs
        id: download-logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: suite-logs-*
          path: ${{ runner.temp }}/all-suite-logs

      - name: Prove exhaustive ownership and tally every log
        if: always()
        run: |
          shopt -s nullglob
          roots=("$RUNNER_TEMP"/all-suite-logs/suite-logs-*)
          if [ "${#roots[@]}" -eq 0 ]; then
            mkdir -p "$RUNNER_TEMP/all-suite-logs/none"
            roots=("$RUNNER_TEMP/all-suite-logs/none")
          fi
          python3 scripts/suite_tally.py "${roots[@]}" --quiet \
            --expect-suite-root tb/verilator

      - name: Require every shard worker to pass
        if: always()
        env:
          SHARD_RESULT: ${{ needs.verilator-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "one or more Verilator shard workers ended: $SHARD_RESULT" >&2
            exit 1
          fi

  # BDD conformance suite (Gherkin, tests/features). Offline by default - the
  # Python models in tests/steps mirror the RTL, so it needs no DUT binary and
  # no simulator, and it runs in seconds. It is the spec-facing counterpart to
  # the Verilator suites: those prove the RTL does what it does, this proves it
  # does what the standard says. USER standing order: it runs on EVERY
  # verification round, so it is a gate, not a ritual.
  bdd-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the processor model inputs
        run: git submodule update --init protocol-processor
      - name: Install behave
        run: python3 -m pip install --quiet behave
      - name: Run the suite
        working-directory: tests
        run: behave --no-capture -f plain

  # Vendor-independence gate: every top must synthesise under Yosys, which is
  # what keeps the ECP5 target reachable and keeps vendor primitives from
  # creeping back in. Needs sv2v, which is NOT in the Ubuntu repos - the
  # prebuilt release binary is the supported route (same as QUICKSTART.md).
  # Distro Yosys IS fine here: nothing above depends on its version.
  yosys-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the RTL submodules
        # gptp-processor feeds the KL_gptp_shadow top's source list
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor
      - name: Install Yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V
      - name: Install sv2v from the upstream release
        run: |
          set -eu
          ver=v0.0.12
          url="https://github.com/zachjs/sv2v/releases/download/${ver}/sv2v-Linux.zip"
          curl -fsSL "$url" -o /tmp/sv2v.zip
          unzip -q -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m755 "$(find /tmp/sv2v -name sv2v -type f | head -1)" /usr/local/bin/sv2v
          sv2v --version
      - name: Portability sweep
        run: syn/yosys/run.sh
