name: rtl-full

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  # The dispatcher chooses the ref (`gh workflow run rtl.yml --ref <branch>`)
  # and there are no inputs: the run validates that ref's tip, pinned as
  # GITHUB_SHA exactly like every other event.
  workflow_dispatch:
  # `dev` is the repository default branch (since 2026-08-22, #174), and
  # GitHub schedules the default branch only, so this cron validates dev's
  # tip at 01:17 UTC. scripts/ci_events.py holds docs/testing/CI_WORKFLOWS.md
  # to the same time string.
  schedule:
    - cron: "17 1 * * *"

# Marking a PR draft again starts a no-op run in the same group and cancels any
# obsolete exhaustive work. A later commit to a ready PR replaces old evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERILATOR_VERSION: v5.050
  # The portability gate takes its verdict with this exact Yosys (#287):
  # built from the upstream tag with its bundled ABC submodule, cached, and
  # version-verified in every job that runs it. Declared once per workflow
  # file; syn/yosys/README.md quotes it as what a local run has to match.
  YOSYS_VERSION: v0.66
  TSN_GEN_REV: fde652067d3618f47fba2c2e8eb05f6c9f6fa97f

jobs:
  full-ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.gate.outputs.run_full }}
      rtl: ${{ steps.gate.outputs.rtl }}
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One authoritative SHA per run (#174, decision 2). GitHub pins
      # GITHUB_SHA for every event: a push or PR merge commit, the tip of dev
      # for the schedule, the chosen ref's tip for a dispatch. Every job below
      # checks out that SHA (no checkout overrides `ref`, which
      # scripts/ci_events.py refuses), every worker records it beside its
      # evidence, and both aggregates refuse evidence for any other tree.
      - name: Print the event and pin the one SHA this run validates
        id: target
        run: |
          set -euo pipefail
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD $head is not GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          echo "target_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # The cron was inert for three weeks because the default branch was
      # `main` (#174), and no gate that reads files can see that repository
      # setting. So the runs it governs read it live: a scheduled run
      # validates the default branch's tip and a dispatch exists only because
      # the workflow is on that branch, so both refuse unless it is `dev`,
      # naming what they saw (a value they could not read refuses too). PR and
      # push runs are about the tree, not the setting: they print the value
      # and carry on, so a drift is visible on every run and fatal on the runs
      # it would misdirect. scripts/ci_events.py holds the decision and pins
      # this step's script verbatim (whitespace aside): one unconditional
      # live read into `observed`, one verifier call after it, nothing else.
      - name: Assert the repository default branch is dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observed="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch 2>/dev/null || echo unreadable)"
          python3 scripts/ci_events.py --require-default-branch \
            --event "$GITHUB_EVENT_NAME" --observed "$observed"

      # The second hosted runner of the workflow contract (#261, maintainer
      # review on PR #293). docs.yml's `docs-check` runs `--check` too, and
      # it cannot police itself: `if: false` on that job skips the one step
      # that would have refused it, and a skipped required context satisfies
      # the ruleset. This job cannot be neutered the same way: a gate that
      # is skipped or fails makes both required aggregates fail closed.
      - name: Hold every workflow file to its contract
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/ci_events.py --check

      - name: Decide whether this exact head needs the exhaustive gates
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_scope.py --selftest

          if [ "$EVENT_NAME" != pull_request ]; then
            echo "rtl=true" >> "$GITHUB_OUTPUT"
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: exhaustive validation required."
            exit 0
          fi

          if [ -n "$PR_BASE_SHA" ] \
             && git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$PR_BASE_SHA" "$GITHUB_SHA" \
              > "$RUNNER_TEMP/changed-files"
          else
            git ls-files > "$RUNNER_TEMP/changed-files"
          fi

          echo "Changed files:"
          sed 's/^/  /' "$RUNNER_TEMP/changed-files"
          rtl="$(python3 scripts/ci_scope.py < "$RUNNER_TEMP/changed-files")"
          run_full=false
          if [ "$PR_DRAFT" = false ] && [ "$rtl" = true ]; then
            run_full=true
          fi
          echo "rtl=$rtl" >> "$GITHUB_OUTPUT"
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "draft=$PR_DRAFT rtl=$rtl run_full=$run_full"

  # The exhaustive inventory remains four-way and fail-closed. Specialized
  # setup is installed only on the stable shard that owns the relevant suite;
  # scripts/suite_shards.py self-tests those ownership assumptions.
  #
  # The shard COUNT is carried into each worker as matrix.total. GitHub and
  # act both resolve matrix values; act v0.2.89 does not resolve
  # strategy.job-total correctly. scripts/ci_events.py requires total to be a
  # singleton equal to the shard-list size and requires every denominator to
  # derive from it, so growing one without the other fails closed (#209, #268).
  verilator-shards:
    name: Verilator shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: full-ci-gate
    if: ${{ needs.full-ci-gate.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RTL dependencies
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor

      # Record the tree this worker validates beside its evidence, and refuse
      # to start on any other. The record is not a *.log, so suite_tally.py
      # never reads it; the verilator-suites aggregate does.
      - name: Record the tree this worker validates
        env:
          TARGET_SHA: ${{ needs.full-ci-gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ] || [ "$GITHUB_SHA" != "$TARGET_SHA" ]; then
            echo "checkout $head, GITHUB_SHA $GITHUB_SHA and gate target $TARGET_SHA must be one SHA" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/suite-logs"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/suite-logs/TARGET_SHA"
          echo "target_sha=$GITHUB_SHA"

      - name: Cache the pinned Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Build Verilator from source on cache miss
        if: ${{ steps.cache-verilator.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make autoconf g++ flex bison libfl2 libfl-dev help2man perl python3
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git /tmp/verilator-src
          cd /tmp/verilator-src
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          sudo make install

      - name: Put Verilator on PATH and prove the version
        run: |
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
          /opt/verilator/bin/verilator --version
          /opt/verilator/bin/verilator --version | grep -F "${VERILATOR_VERSION#v}"

      - name: Prove specialized suite ownership
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.total }}
        run: |
          set -euo pipefail
          python3 scripts/suite_shards.py --selftest
          scripts/run_all_suites.sh --shard "$SHARD/$SHARDS" --list \
            > "$RUNNER_TEMP/owned-suites"
          echo "Shard $SHARD owns:"
          sed 's/^/  /' "$RUNNER_TEMP/owned-suites"
          case "$SHARD" in
            1) grep -Fx tsn_fuzz "$RUNNER_TEMP/owned-suites" ;;
            3) grep -Fx chmap_capture "$RUNNER_TEMP/owned-suites" ;;
          esac

      - name: Cache the pinned Yosys build for the netlist-level suite owner
        if: ${{ matrix.shard == 3 }}
        id: cache-yosys
        uses: actions/cache@v4
        with:
          path: /opt/yosys
          key: yosys-${{ env.YOSYS_VERSION }}-${{ runner.os }}

      - name: Build Yosys from source on cache miss
        if: ${{ matrix.shard == 3 && steps.cache-yosys.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make g++ bison flex pkg-config zlib1g-dev python3
          git clone --depth 1 --branch "$YOSYS_VERSION" \
            https://github.com/YosysHQ/yosys.git /tmp/yosys-src
          git -C /tmp/yosys-src submodule update --init --depth 1 abc libs/cxxopts
          make -C /tmp/yosys-src config-gcc
          printf 'ENABLE_TCL := 0\nENABLE_READLINE := 0\nENABLE_PLUGINS := 0\n' \
            >> /tmp/yosys-src/Makefile.conf
          make -C /tmp/yosys-src -j"$(nproc)" PREFIX=/opt/yosys
          sudo make -C /tmp/yosys-src install PREFIX=/opt/yosys
          git -C /tmp/yosys-src/abc rev-parse HEAD | sudo tee /opt/yosys/ABC_REV

      - name: Install the pinned Yosys and prove the version
        if: ${{ matrix.shard == 3 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libjemalloc2
          sudo ln -sf /opt/yosys/bin/yosys /opt/yosys/bin/yosys-abc /usr/local/bin/
          test -x /opt/yosys/bin/yosys-abc
          echo "bundled ABC: $(cat /opt/yosys/ABC_REV)"
          yosys -V
          yosys -V | grep -F "Yosys ${YOSYS_VERSION#v}"

      - name: Install sv2v for the netlist-level suite owner
        if: ${{ matrix.shard == 3 }}
        run: |
          set -euo pipefail
          ver=v0.0.12
          sha256=ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00
          url="https://github.com/zachjs/sv2v/releases/download/${ver}/sv2v-Linux.zip"
          curl -fsSL "$url" -o /tmp/sv2v.zip
          echo "${sha256}  /tmp/sv2v.zip" | sha256sum -c -
          unzip -q -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m755 "$(find /tmp/sv2v -name sv2v -type f | head -1)" \
            /usr/local/bin/sv2v
          sv2v --version

      - name: Build the pinned tsn-gen field oracle on its suite owner
        if: ${{ matrix.shard == 1 }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://github.com/kebag-logic/tsn-gen.git "$RUNNER_TEMP/tsn-gen"
          git -C "$RUNNER_TEMP/tsn-gen" checkout "$TSN_GEN_REV"
          git -C "$RUNNER_TEMP/tsn-gen" submodule update \
            --init --depth 1 --recursive external/rapidyaml
          cmake -S "$RUNNER_TEMP/tsn-gen" -B "$RUNNER_TEMP/tsn-gen/build" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_PARSER_TESTS=OFF
          cmake --build "$RUNNER_TEMP/tsn-gen/build" \
            --target packet_gen --parallel
          test -x "$RUNNER_TEMP/tsn-gen/build/traffic-gen/packet_gen"
          echo "TSN_GEN_ROOT=$RUNNER_TEMP/tsn-gen" >> "$GITHUB_ENV"

      - name: Run this exhaustive suite shard
        run: |
          scripts/run_all_suites.sh "$RUNNER_TEMP/suite-logs" \
            --shard "${{ matrix.shard }}/${{ matrix.total }}"

      - name: Upload this shard's suite logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/suite-logs
          if-no-files-found: error
          retention-days: 3

  verilator-suites:
    name: verilator-suites
    # Skip only an EXPLICIT no-op decision from a successful selector. If the
    # selector fails, is cancelled, or never publishes run_full, this job must
    # run and fail on the missing gate SHA/shards; SKIPPED satisfies a required
    # GitHub context and would otherwise turn a selector failure into a pass.
    if: ${{ always() && (needs.full-ci-gate.result != 'success' || needs.full-ci-gate.outputs.run_full != 'false') }}
    needs: [full-ci-gate, verilator-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download every shard's logs
        id: download-logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: suite-logs-*
          path: ${{ runner.temp }}/all-suite-logs

      # Refuse evidence for any tree but this run's (#174, decision 2): every
      # shard must carry a TARGET_SHA equal to the gate's target, to this
      # job's GITHUB_SHA and to its checkout. A missing record is a failure,
      # never a skip; so is an empty download, and so is any count of shard
      # directories but the worker matrix size (--expect). scripts/ci_events.py
      # derives this step's script from the download step and the matrix and
      # pins it, its keys, its env and its `if` verbatim.
      - name: Require every shard to have validated this run's SHA
        if: ${{ always() }}
        env:
          GATE_SHA: ${{ needs.full-ci-gate.outputs.target_sha }}
        run: |
          shopt -s nullglob
          roots=("$RUNNER_TEMP"/all-suite-logs/suite-logs-*)
          python3 scripts/ci_events.py --require-target-sha --expect 4 \
            --sha gate="$GATE_SHA" --sha run="$GITHUB_SHA" \
            --sha checkout="$(git rev-parse HEAD)" -- "${roots[@]}"

      - name: Prove exhaustive ownership and tally every log
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          roots=("$RUNNER_TEMP"/all-suite-logs/suite-logs-*)
          if [ "${#roots[@]}" -eq 0 ]; then
            mkdir -p "$RUNNER_TEMP/all-suite-logs/none"
            roots=("$RUNNER_TEMP/all-suite-logs/none")
          fi
          python3 scripts/suite_tally.py "${roots[@]}" --quiet \
            --expect-suite-root tb/verilator
      - name: Require every Verilator worker to pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.verilator-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "one or more Verilator workers ended: $SHARD_RESULT" >&2
            exit 1
          fi
          echo "verilator-suites: every worker succeeded at $GITHUB_SHA"

  # Weighted longest-processing-time assignment isolates the two dominant
  # tops and balances the remaining 44 without changing the local serial gate.
  yosys-shards:
    name: Yosys shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: full-ci-gate
    if: ${{ needs.full-ci-gate.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RTL dependencies
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor

      # Same record as the Verilator workers. Not a *.result, so yosys_tally.py
      # never reads it; the yosys-portability aggregate does.
      - name: Record the tree this worker validates
        env:
          TARGET_SHA: ${{ needs.full-ci-gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ] || [ "$GITHUB_SHA" != "$TARGET_SHA" ]; then
            echo "checkout $head, GITHUB_SHA $GITHUB_SHA and gate target $TARGET_SHA must be one SHA" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/yosys-results"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/yosys-results/TARGET_SHA"
          echo "target_sha=$GITHUB_SHA"

      # The tool this gate is named after, pinned the way Verilator is above
      # (#287): one declared version (workflow `env`), built from the
      # upstream tag on a cache miss with its bundled ABC submodule - the
      # commit the tag pins, recorded in /opt/yosys/ABC_REV and printed on
      # every run - then verified by a step that fails on any other version.
      # The apt package this replaces resolved to whatever ubuntu-latest
      # carried on the day (Yosys 0.33, 33 releases behind a bench box), and
      # the same RTL's cell counts moved up to 39% between that tool and the
      # bench one with both exiting 0.
      - name: Cache the pinned Yosys build
        id: cache-yosys
        uses: actions/cache@v4
        with:
          path: /opt/yosys
          key: yosys-${{ env.YOSYS_VERSION }}-${{ runner.os }}

      - name: Build Yosys from source on cache miss
        if: ${{ steps.cache-yosys.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make g++ bison flex pkg-config zlib1g-dev python3
          git clone --depth 1 --branch "$YOSYS_VERSION" \
            https://github.com/YosysHQ/yosys.git /tmp/yosys-src
          git -C /tmp/yosys-src submodule update --init --depth 1 abc libs/cxxopts
          make -C /tmp/yosys-src config-gcc
          printf 'ENABLE_TCL := 0\nENABLE_READLINE := 0\nENABLE_PLUGINS := 0\n' \
            >> /tmp/yosys-src/Makefile.conf
          make -C /tmp/yosys-src -j"$(nproc)" PREFIX=/opt/yosys
          sudo make -C /tmp/yosys-src install PREFIX=/opt/yosys
          git -C /tmp/yosys-src/abc rev-parse HEAD | sudo tee /opt/yosys/ABC_REV

      - name: Install the pinned Yosys and prove the version
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libjemalloc2
          sudo ln -sf /opt/yosys/bin/yosys /opt/yosys/bin/yosys-abc /usr/local/bin/
          test -x /opt/yosys/bin/yosys-abc
          echo "bundled ABC: $(cat /opt/yosys/ABC_REV)"
          yosys -V
          yosys -V | grep -F "Yosys ${YOSYS_VERSION#v}"
      - name: Install the pinned sv2v release
        run: |
          set -euo pipefail
          ver=v0.0.12
          sha256=ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00
          url="https://github.com/zachjs/sv2v/releases/download/${ver}/sv2v-Linux.zip"
          curl -fsSL "$url" -o /tmp/sv2v.zip
          echo "${sha256}  /tmp/sv2v.zip" | sha256sum -c -
          unzip -q -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m755 "$(find /tmp/sv2v -name sv2v -type f | head -1)" \
            /usr/local/bin/sv2v
          sv2v --version
      - name: Run this weighted portability shard
        run: |
          syn/yosys/run.sh --shard "${{ matrix.shard }}/${{ matrix.total }}" \
            --results "$RUNNER_TEMP/yosys-results"
      - name: Upload per-top and structural evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yosys-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/yosys-results
          if-no-files-found: error
          retention-days: 3

  yosys-portability:
    name: yosys-portability
    # Same fail-closed selector contract as verilator-suites above.
    # Keep the two artifact aggregates ordered for act v0.2.89: its shared
    # action cache can race when both first initialize download-artifact.
    # always() below still makes this job run when verilator-suites fails.
    if: ${{ always() && (needs.full-ci-gate.result != 'success' || needs.full-ci-gate.outputs.run_full != 'false') }}
    needs: [full-ci-gate, yosys-shards, verilator-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download every shard's evidence
        id: download-results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: yosys-results-*
          path: ${{ runner.temp }}/all-yosys-results

      # Same refusal as verilator-suites, over the Yosys evidence.
      - name: Require every shard to have validated this run's SHA
        if: ${{ always() }}
        env:
          GATE_SHA: ${{ needs.full-ci-gate.outputs.target_sha }}
        run: |
          shopt -s nullglob
          roots=("$RUNNER_TEMP"/all-yosys-results/yosys-results-*)
          python3 scripts/ci_events.py --require-target-sha --expect 4 \
            --sha gate="$GATE_SHA" --sha run="$GITHUB_SHA" \
            --sha checkout="$(git rev-parse HEAD)" -- "${roots[@]}"

      - name: Reconcile the live inventory and structural gates
        if: ${{ always() }}
        run: |
          set -euo pipefail
          syn/yosys/run.sh --list > "$RUNNER_TEMP/expected-yosys-tops"
          shopt -s nullglob
          roots=("$RUNNER_TEMP"/all-yosys-results/yosys-results-*)
          if [ "${#roots[@]}" -eq 0 ]; then
            mkdir -p "$RUNNER_TEMP/all-yosys-results/none"
            roots=("$RUNNER_TEMP/all-yosys-results/none")
          fi
          python3 scripts/yosys_tally.py "${roots[@]}" \
            --expected "$RUNNER_TEMP/expected-yosys-tops" \
            --require-structural
      - name: Require every Yosys worker to pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.yosys-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "one or more Yosys workers ended: $SHARD_RESULT" >&2
            exit 1
          fi
          echo "yosys-portability: every worker succeeded at $GITHUB_SHA"
