  yosys-tool:
    name: Prepare pinned Yosys
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    needs: full-ci-gate
    if: ${{ needs.full-ci-gate.outputs.run_full == 'true' }}
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          tool_build=$(( cpus < 8 ? cpus : 8 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_TOOL_BUILD_JOBS=%s\n' "$tool_build"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Cache the pinned Yosys build
        id: cache-yosys
        uses: actions/cache@v4
        with:
          path: /opt/yosys
          key: yosys-${{ env.YOSYS_VERSION }}-86f2ddebce7e98ce7cacc27e8a5c14cb53b51b51-${{ hashFiles('.github/workflows/*.yml')
            }}-${{ runner.os }}
      - name: Resolve exact package downloads 2
        id: ci_packages_2
        run: |
          python3 scripts/ci_install_cache.py --packages bison flex g++ git libfl-dev make pkg-config python3 zlib1g-dev --recipe 36059bacbb524ab5c7daadb0f78093ad7b3400d564445eb830832674c3112354 --directory "$RUNNER_TEMP/ci_packages_2" --output "$GITHUB_OUTPUT"
        if: ${{ steps.cache-yosys.outputs.cache-hit != 'true' }}
      - name: Cache exact package downloads 2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci_packages_2
          key: ${{ runner.os }}-${{ steps.ci_packages_2.outputs.key }}-${{ hashFiles('scripts/ci_install*.py',
            '.github/workflows/*.yml') }}
        if: ${{ steps.cache-yosys.outputs.cache-hit != 'true' }}
        id: ci_step_4
      - name: Build Yosys from source on cache miss
        if: ${{ steps.cache-yosys.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          : # package index prepared above
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/ci_packages_2" install -y --no-install-recommends \
            git make g++ bison flex libfl-dev pkg-config zlib1g-dev python3
          git clone --depth 1 --branch "$YOSYS_VERSION" \
            https://github.com/YosysHQ/yosys.git /tmp/yosys-src
          test "$(git -C /tmp/yosys-src rev-parse HEAD)" = "86f2ddebce7e98ce7cacc27e8a5c14cb53b51b51"
          git -C /tmp/yosys-src submodule update --init --depth 1 abc libs/cxxopts
          make -C /tmp/yosys-src config-gcc
          printf 'ENABLE_TCL := 0\nENABLE_READLINE := 0\nENABLE_PLUGINS := 0\n' \
            >> /tmp/yosys-src/Makefile.conf
          make -C /tmp/yosys-src -j"$CI_TOOL_BUILD_JOBS" PREFIX=/opt/yosys
          sudo make -C /tmp/yosys-src install PREFIX=/opt/yosys
          git -C /tmp/yosys-src/abc rev-parse HEAD | sudo tee /opt/yosys/ABC_REV
          # runner-owned so the cache action's save and restore are symmetric
          sudo chown -R "$(id -u):$(id -g)" /opt/yosys
        id: ci_step_5
      - name: Package the pinned Yosys build
        run: |
          tar -C /opt -czf "$RUNNER_TEMP/yosys.tar.gz" yosys
        id: ci_step_6
      - name: Upload the pinned Yosys build
        uses: actions/upload-artifact@v4
        with:
          name: pinned-yosys-${{ github.sha }}
          path: ${{ runner.temp }}/yosys.tar.gz
          if-no-files-found: error
          retention-days: 3
        id: ci_step_7
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl.yml --job yosys-tool --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-yosys-tool-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
