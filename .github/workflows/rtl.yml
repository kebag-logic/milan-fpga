            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Download every shard's evidence
        id: download-results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: yosys-results-*
          path: ${{ runner.temp }}/all-yosys-results
      - name: Require every shard to have validated this run's SHA
        if: ${{ always() }}
