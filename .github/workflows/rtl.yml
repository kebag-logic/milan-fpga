  ci-manifest:
    name: Collect CI manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    needs:
      - full-ci-gate
      - verilator-shards
      - physical-gptp
      - verilator-suites
      - yosys-shards
      - yosys-portability
      - yosys-tool
      - union-milan_dp
      - union-milan_dp_mclk
      - union-capture_coherence
      - union-maap
      - union-milan_dp_render
      - union-pp_shadow
    permissions:
      contents: read
      actions: read
    outputs:
      observer_only_error: ${{ steps.ci_collect.outputs.observer_error == 'true' && steps.ci_collect.outcome
        == 'success' && steps.ci_upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          tool_build=$(( cpus < 8 ? cpus : 8 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_TOOL_BUILD_JOBS=%s\n' "$tool_build"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
      - name: Fetch inventory dependencies
        run: |
          git submodule update --init third_party/verilog-axis protocol-processor gptp-processor third_party/tsn-c-stack
      - name: Cache pinned evidence reader downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pyyaml-6.0.2-d584d9ec91ad65861cc08d42e834324ef890a082e591037abe114850ff7bbc3e-${{ hashFiles('ci/requirements-evidence.txt',
            'scripts/ci_runtime_workflows.py', 'scripts/ci_gate_workflows.py', '.github/workflows/*.yml')
            }}-${{ runner.os }}
      - name: Install the pinned evidence reader
        run: |
          python3 -m pip install --quiet --require-hashes --no-deps -r ci/requirements-evidence.txt
      - name: Download completed execution artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/manifest-inputs
      - name: Collect actual runtime evidence
        id: ci_collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_runtime_evidence.py collect --run "$GITHUB_RUN_ID" --artifacts "$RUNNER_TEMP/manifest-inputs" --output "$RUNNER_TEMP/ci-manifest.json"
      - name: Upload canonical CI manifest
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-manifest-rtl-${{ github.sha }}
          path: ${{ runner.temp }}/ci-manifest.json
          if-no-files-found: error
          retention-days: 3
  ci-fail-fast:
    name: Fail fast across this head
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository) }}
    permissions:
      contents: read
      actions: write
    outputs:
      observer_only_error: ${{ steps.ci_observe.outputs.observer_error == 'true' && steps.ci_record.outcome
        == 'success' && steps.ci_upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          tool_build=$(( cpus < 8 ? cpus : 8 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_TOOL_BUILD_JOBS=%s\n' "$tool_build"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Observe the first failed job
        id: ci_observe
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_JOBS: '["Collect CI manifest","full-ci-gate","Physical gPTP (nightly and manual)","Union
            capture_coherence","Union maap","Union milan_dp","Union milan_dp_mclk","Union milan_dp_render","Union
            pp_shadow","Verilator shard 0/17","Verilator shard 1/17","Verilator shard 2/17","Verilator
            shard 3/17","Verilator shard 4/17","Verilator shard 5/17","Verilator shard 6/17","Verilator
            shard 7/17","Verilator shard 8/17","Verilator shard 9/17","Verilator shard 10/17","Verilator
            shard 11/17","Verilator shard 12/17","Verilator shard 13/17","Verilator shard 14/17","Verilator
            shard 15/17","Verilator shard 16/17","verilator-suites","yosys-portability","Yosys shard 0/4","Yosys
            shard 1/4","Yosys shard 2/4","Yosys shard 3/4","Prepare pinned Yosys"]'
          SKIPPED_MATRICES: '{"Verilator shard ${{ matrix.shard }}/${{ matrix.total }}":["Verilator shard
            0/17","Verilator shard 1/17","Verilator shard 2/17","Verilator shard 3/17","Verilator shard
            4/17","Verilator shard 5/17","Verilator shard 6/17","Verilator shard 7/17","Verilator shard
            8/17","Verilator shard 9/17","Verilator shard 10/17","Verilator shard 11/17","Verilator shard
            12/17","Verilator shard 13/17","Verilator shard 14/17","Verilator shard 15/17","Verilator
            shard 16/17"],"Yosys shard ${{ matrix.shard }}/${{ matrix.total }}":["Yosys shard 0/4","Yosys
            shard 1/4","Yosys shard 2/4","Yosys shard 3/4"]}'
        run: |
          python3 scripts/ci_fail_fast.py watch
      - name: Cancel this run and sibling workflows
        if: ${{ failure() && steps.ci_observe.outputs.observer_error != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_fail_fast.py cancel
        id: ci_step_3
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl.yml --job ci-fail-fast --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-ci-fail-fast-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
