  verilator-suites:
    name: verilator-suites
    if: ${{ always() && (needs.full-ci-gate.result != 'success' || needs.full-ci-gate.outputs.run_full
      != 'false') }}
    needs:
      - full-ci-gate
      - verilator-shards
      - union-milan_dp
      - union-milan_dp_mclk
      - union-capture_coherence
      - union-maap
      - union-milan_dp_render
      - union-pp_shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          tool_build=$(( cpus < 8 ? cpus : 8 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_TOOL_BUILD_JOBS=%s\n' "$tool_build"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Fetch inventory dependencies
        run: |
          git submodule update --init third_party/verilog-axis protocol-processor gptp-processor third_party/tsn-c-stack
        id: ci_step_2
      - name: Download every shard's logs
        id: download-logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: suite-logs-*
          path: ${{ runner.temp }}/all-suite-logs
      - name: Download verified suite unions
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: suite-union-*
          path: ${{ runner.temp }}/suite-unions
        id: ci_step_4
      - name: Require every shard to have validated this run's SHA
        if: ${{ always() }}
        env:
          GATE_SHA: ${{ needs.full-ci-gate.outputs.target_sha }}
        run: |
          shopt -s nullglob
          roots=("$RUNNER_TEMP"/all-suite-logs/suite-logs-*)
          python3 scripts/ci_events.py --require-target-sha --expect 17 \
            --sha gate="$GATE_SHA" --sha run="$GITHUB_SHA" \
            --sha checkout="$(git rev-parse HEAD)" -- "${roots[@]}"
        id: ci_step_5
      - name: Prove exhaustive ownership and tally every log
        if: ${{ always() }}
        run: |
          python3 scripts/ci_suite_collect.py   --workers "$RUNNER_TEMP/all-suite-logs" --unions "$RUNNER_TEMP/suite-unions"   --output "$RUNNER_TEMP/complete-suite-logs" --head "$GITHUB_SHA"
          python3 scripts/suite_tally.py "$RUNNER_TEMP/complete-suite-logs" --quiet   --expect-suite-root tb/verilator
        id: ci_step_6
      - name: Require every Verilator worker to pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.verilator-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "one or more Verilator workers ended: $SHARD_RESULT" >&2
            exit 1
          fi
          echo "verilator-suites: every worker succeeded at $GITHUB_SHA"
        id: ci_step_7
      - name: Require every case union to succeed
        if: ${{ always() }}
        env:
          UNION_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['UNION_NEEDS'])
          assert all(row['result'] == 'success' for row in needs.values()), needs
          PY
        id: ci_step_8
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl.yml --job verilator-suites --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-verilator-suites-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
  yosys-shards:
    name: Yosys shard ${{ matrix.shard }}/${{ matrix.total }}
    needs:
      - full-ci-gate
      - yosys-tool
    if: ${{ needs.full-ci-gate.outputs.run_full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    strategy:
      fail-fast: true
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
        total:
          - 4
    steps:
      - uses: actions/checkout@v4
        id: ci_step_0
        name: Run actions/checkout@v4
      - name: Set CPU-derived job budgets
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          test "$cpus" -gt 0
          campaign=$(( cpus < 4 ? cpus : 4 ))
          simulations=$(( cpus < 4 ? cpus : 4 ))
          tool_build=$(( cpus < 8 ? cpus : 8 ))
          {
            printf 'CI_BUILD_JOBS=%s\n' "$cpus"
            printf 'CI_TOOL_BUILD_JOBS=%s\n' "$tool_build"
            printf 'CI_CAMPAIGN_JOBS=%s\n' "$campaign"
            printf 'VERILATOR_JOBS=%s\n' "$cpus"
            printf 'SIM_JOBS=%s\n' "$simulations"
            printf 'MAKEFLAGS=-j1 --no-print-directory\n'
          } >> "$GITHUB_ENV"
        id: ci_step_1
      - name: Fetch RTL dependencies
        run: git submodule update --init third_party/verilog-axis protocol-processor gptp-processor
        id: ci_step_2
      - name: Record the tree this worker validates
        env:
          TARGET_SHA: ${{ needs.full-ci-gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ] || [ "$GITHUB_SHA" != "$TARGET_SHA" ]; then
            echo "checkout $head, GITHUB_SHA $GITHUB_SHA and gate target $TARGET_SHA must be one SHA" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/yosys-results"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/yosys-results/TARGET_SHA"
          echo "target_sha=$GITHUB_SHA"
        id: ci_step_3
      - name: Download the pinned Yosys build
        uses: actions/download-artifact@v4
        with:
          name: pinned-yosys-${{ github.sha }}
          path: ${{ runner.temp }}/yosys-tool
        id: ci_step_4
      - name: Restore the pinned Yosys build
        run: |
          sudo tar -C /opt -xzf "$RUNNER_TEMP/yosys-tool/yosys.tar.gz"
        id: ci_step_5
      - name: Resolve exact package downloads 5
        id: ci_packages_5
        run: |
          python3 scripts/ci_install_cache.py --packages libjemalloc2 --recipe 059a32a5bea6f851e8deff0d497a3b47323f7053ddee7c9139d4be8525e29d87 --directory "$RUNNER_TEMP/ci_packages_5" --output "$GITHUB_OUTPUT"
      - name: Cache exact package downloads 5
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci_packages_5
          key: ${{ runner.os }}-${{ steps.ci_packages_5.outputs.key }}-${{ hashFiles('scripts/ci_install*.py',
            '.github/workflows/*.yml') }}
        id: ci_step_7
      - name: Install the pinned Yosys and prove the version
        run: |
          set -euo pipefail
          : # package index prepared above
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/ci_packages_5" install -y --no-install-recommends libjemalloc2
          sudo ln -sf /opt/yosys/bin/yosys /opt/yosys/bin/yosys-abc /usr/local/bin/
          test -x /opt/yosys/bin/yosys-abc
          echo "bundled ABC: $(cat /opt/yosys/ABC_REV)"
          yosys -V
          yosys -V | grep -F "Yosys ${YOSYS_VERSION#v}"
        id: ci_step_8
      - name: Cache verified sv2v archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-sv2v-cache
          key: sv2v-v0.0.12-ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00-${{ hashFiles('scripts/ci_install*.py',
            '.github/workflows/*.yml') }}-${{ runner.os }}
        id: ci_step_9
      - name: Install the pinned sv2v release
        run: |
          set -euo pipefail
          ver=v0.0.12
          sha256=ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00
          url="https://github.com/zachjs/sv2v/releases/download/${ver}/sv2v-Linux.zip"
          mkdir -p "$RUNNER_TEMP/ci-sv2v-cache"
          archive="$RUNNER_TEMP/ci-sv2v-cache/sv2v.zip"
          if [ ! -f "$archive" ]; then curl -fsSL "$url" -o "$archive"; fi
          echo "${sha256}  $archive" | sha256sum -c -
          unzip -q -o "$archive" -d /tmp/sv2v
          sudo install -m755 "$(find /tmp/sv2v -name sv2v -type f | head -1)" \
            /usr/local/bin/sv2v
          sv2v --version
        id: ci_step_10
      - name: Restore the portability result cache seeded from dev
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/yosys-result-cache
          key: yosys-results-${{ env.YOSYS_VERSION }}-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: yosys-results-${{ env.YOSYS_VERSION }}-shard${{ matrix.shard }}-
        id: ci_step_11
      - name: Run this weighted portability shard
        run: |
          syn/yosys/run.sh --shard "${{ matrix.shard }}/${{ matrix.total }}" \
            --results "$RUNNER_TEMP/yosys-results" \
            --cache "$RUNNER_TEMP/yosys-result-cache"
        id: ci_step_12
      - name: Upload per-top and structural evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yosys-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/yosys-results
          if-no-files-found: error
          retention-days: 3
        id: ci_step_13
      - name: Record actual job execution
        id: ci_record
        if: ${{ always() }}
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_JOB_RESULT: ${{ job.status }}
          CI_MATRIX: ${{ toJSON(matrix) }}
        run: |
          python3 scripts/ci_runtime_evidence.py record --workflow .github/workflows/rtl.yml --job yosys-shards --output "$RUNNER_TEMP/job-evidence.json"
      - name: Upload actual job execution
        id: ci_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-evidence-rtl-yosys-shards-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/job-evidence.json
          if-no-files-found: error
          retention-days: 3
  yosys-portability:
    name: yosys-portability
    if: ${{ always() && (needs.full-ci-gate.result != 'success' || needs.full-ci-gate.outputs.run_full
      != 'false') }}
