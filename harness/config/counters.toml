#
# THE COUNTER AUDIT TABLE (harness phase 3).
#
# For EVERY counter: provoke the event it counts, assert it moved by the
# expected amount, AND assert its neighbours did not. A counter wired to the
# wrong event only shows up that way - it increments happily, and so does the
# one next to it.
#
# Fields
#   name      audit name (family.COUNTER).
#   family    stream_input | stream_output | avb_interface | clock_domain | rmon
#   read      where the harness reads it. Addressing forms:
#               csr:<off>[<hi>:<lo>]       a milan_csr offset + bit field
#               win:<dir>:<idx>:<word>     the 0x800 window, SEL+SNAP discipline
#               rmon:<lane>                RMON lane n (0x210 + 4n), snapshot-armed
#   provoke   provoker name registered in milanharness/phases/p3_counters.py.
#             "" = no automatable provoker; the row is reported not-implemented
#             WITH its reason, never silently dropped.
#   expect    delta predicate over the provoked window: "==N", ">=N", "==0".
#   hold      counters that MUST NOT move across the same window.
#   clears_on_bind  true = a bind edge zeroes it (Milan 5.3.8.10), so the audit
#             reads it BEFORE any re-bind or it reads clean and proves nothing.
#   note      why the expectation is what it is.
#
# Full-width rule: STREAM_INPUT counters are read through the 0x800 window
# (CNT0..9 at 0x830 + 4k, full 32-bit). The flat AVTPRX_* words are SATURATING
# narrow views since VERSION 0x0013 - an audit that read them would mistake a
# ceiling for a value.

schema = "kebag-logic/milan-harness-counters"
schema_version = "1.0.0"

# --- STREAM_INPUT (Milan Table 5.16 / 1722.1 Table 7-157) ------------------

[[counter]]
name = "stream_input.MEDIA_LOCKED"
family = "stream_input"
read = "win:listener:0:cnt0"
provoke = "listener_bind_and_stream"
expect = "==1"
hold = ["stream_input.MEDIA_UNLOCKED", "stream_input.UNSUPPORTED_FORMAT", "stream_input.SEQ_NUM_MISMATCH"]
clears_on_bind = true
note = "8 clean PDUs settle the lock; exactly one lock edge per bind"

[[counter]]
name = "stream_input.MEDIA_UNLOCKED"
family = "stream_input"
read = "win:listener:0:cnt1"
provoke = "talker_stop"
expect = "==1"
hold = ["stream_input.MEDIA_LOCKED", "stream_input.UNSUPPORTED_FORMAT"]
clears_on_bind = true
note = "100 ms of silence unlocks; the lock counter must not also tick"

[[counter]]
name = "stream_input.STREAM_INTERRUPTED"
family = "stream_input"
read = "win:listener:0:cnt2"
provoke = "talker_stop"
expect = ">=1"
hold = ["stream_input.UNSUPPORTED_FORMAT", "stream_input.SEQ_NUM_MISMATCH"]
clears_on_bind = true
note = "same provocation as MEDIA_UNLOCKED, different counter - both must move, and only these two"

[[counter]]
name = "stream_input.SEQ_NUM_MISMATCH"
family = "stream_input"
read = "win:listener:0:cnt3"
provoke = "wire_seq_gap"
expect = ">=1"
hold = ["stream_input.UNSUPPORTED_FORMAT", "stream_input.MEDIA_RESET", "stream_input.TIMESTAMP_UNCERTAIN"]
clears_on_bind = true
note = "needs a wire injector that skips one sequence_num; BLOCKED without controller.controller_tool"

[[counter]]
name = "stream_input.MEDIA_RESET"
family = "stream_input"
read = "win:listener:0:cnt4"
provoke = ""
expect = "==0"
hold = []
clears_on_bind = true
note = "KNOWN GAP (traceability AVTP-5 / M-CNT-4): the parser does not extract the mr bit, so nothing can tick this. The audit records the gap rather than pretending to test it"

[[counter]]
name = "stream_input.TIMESTAMP_UNCERTAIN"
family = "stream_input"
read = "win:listener:0:cnt5"
provoke = ""
expect = "==0"
hold = []
clears_on_bind = true
note = "needs a talker tu edge on a real GM change; the bench switch owns the GM claim, so this is BLOCKED not FAILED"

[[counter]]
name = "stream_input.UNSUPPORTED_FORMAT"
family = "stream_input"
read = "win:listener:0:cnt6"
provoke = "format_change_midstream"
expect = ">=1"
hold = ["stream_input.SEQ_NUM_MISMATCH", "stream_input.MEDIA_RESET"]
clears_on_bind = true
note = "phase 5's mid-stream stream-format change is also this counter's provoker"

[[counter]]
name = "stream_input.LATE_TIMESTAMP"
family = "stream_input"
read = "win:listener:0:cnt7"
provoke = "pto_shrink_midstream"
expect = ">=1"
hold = ["stream_input.EARLY_TIMESTAMP", "stream_input.UNSUPPORTED_FORMAT"]
clears_on_bind = true
note = "shrinking pto under the transit time makes arrivals late; EARLY must stay put - the two are the classic swapped pair"

[[counter]]
name = "stream_input.EARLY_TIMESTAMP"
family = "stream_input"
read = "win:listener:0:cnt8"
provoke = "pto_grow_midstream"
expect = ">=1"
hold = ["stream_input.LATE_TIMESTAMP", "stream_input.UNSUPPORTED_FORMAT"]
clears_on_bind = true
note = "the mirror provocation of LATE_TIMESTAMP; running both is what catches a swap"

[[counter]]
name = "stream_input.FRAMES_RX"
family = "stream_input"
read = "win:listener:0:cnt9"
provoke = "listener_bind_and_stream"
expect = ">=100"
hold = ["stream_input.UNSUPPORTED_FORMAT", "stream_input.SEQ_NUM_MISMATCH", "stream_input.MEDIA_RESET"]
clears_on_bind = true
note = "a clean stream moves frames and nothing else"

# --- STREAM_OUTPUT (Milan Table 5.17) --------------------------------------

[[counter]]
name = "stream_output.STREAM_START"
family = "stream_output"
read = "win:talker:0:pdus"
provoke = "acmp_start_streaming"
expect = ">=1"
hold = ["stream_output.STREAM_STOP"]
clears_on_bind = false
note = "START_STREAMING must not also register as a stop"

[[counter]]
name = "stream_output.STREAM_STOP"
family = "stream_output"
read = "win:talker:0:pdus"
provoke = "acmp_stop_streaming"
expect = ">=1"
hold = ["stream_output.STREAM_START"]
clears_on_bind = false
note = "mirror of STREAM_START"

[[counter]]
name = "stream_output.MEDIA_RESET"
family = "stream_output"
read = ""
provoke = ""
expect = "==0"
hold = []
clears_on_bind = false
note = "KNOWN GAP (traceability M-CNT-4): talker-side MEDIA_RESET has never been asserted anywhere; no CSR view exists to read it from"

[[counter]]
name = "stream_output.FRAMES_TX"
family = "stream_output"
read = "csr:0x660"
provoke = "talker_start"
expect = ">=100"
hold = []
clears_on_bind = false
note = "AAF_FRAMES; the talker's own frames-sent rail"

# --- AVB_INTERFACE (Milan Table 5.13) --------------------------------------

[[counter]]
name = "avb_interface.LINK_DOWN"
family = "avb_interface"
read = "csr:0x774[31:16]"
provoke = "link_cut_detached"
expect = "==1"
hold = ["avb_interface.LINK_UP", "stream_input.UNSUPPORTED_FORMAT"]
clears_on_bind = false
note = "EXACTLY one per physical flap - the +2-per-flap defect is precisely what a >=1 predicate would have missed. LINKG_STAT bounce_cnt is the physical-episode view"

[[counter]]
name = "avb_interface.LINK_UP"
family = "avb_interface"
read = "csr:0x720"
provoke = "link_cut_detached"
expect = "==0"
hold = []
clears_on_bind = false
note = "RST_EPOCH must NOT tick on a plain link bounce that the guard rides out; a tick here means the datapath was reset, which is a different event"

# --- CLOCK_DOMAIN (Milan Table 5.15) ---------------------------------------

[[counter]]
name = "clock_domain.LOCKED"
family = "clock_domain"
read = "csr:0x74C[31:16]"
provoke = "crf_bind"
expect = ">=8"
hold = ["clock_domain.FORMAT_ERR", "clock_domain.SEQ_ERR"]
clears_on_bind = false
note = "CRF_STATUS PDUs-accepted; 8 clean consecutive PDUs is the documented lock rule"

[[counter]]
name = "clock_domain.FORMAT_ERR"
family = "clock_domain"
read = "csr:0x74C[15:8]"
provoke = ""
expect = "==0"
hold = []
clears_on_bind = false
note = "needs an off-profile CRF injector (no CRF model in the wire generator today) - BLOCKED, listed"

[[counter]]
name = "clock_domain.SEQ_ERR"
family = "clock_domain"
read = "csr:0x74C[7:0]"
provoke = ""
expect = "==0"
hold = []
clears_on_bind = false
note = "same injector gap as FORMAT_ERR"

# --- RMON (0x200 group; STATS_CAP 0x204 declares which lanes are real) -----

[[counter]]
name = "rmon.TX_ERROR_UNDERFLOW"
family = "rmon"
read = "rmon:0"
provoke = "cap_declared_unsupported"
expect = "==0"
hold = []
clears_on_bind = false
note = "STATS_CAP bit 0 must read 0 AND the lane must read 0 - declared unsupported, never faked"

[[counter]]
name = "rmon.TX_FIFO_OVERFLOW"
family = "rmon"
read = "rmon:1"
provoke = "cap_declared_unsupported"
expect = "==0"
hold = []
clears_on_bind = false
note = "MAC-internal, no source at this boundary"

[[counter]]
name = "rmon.TX_FIFO_BAD_FRAME"
family = "rmon"
read = "rmon:2"
provoke = "cap_declared_unsupported"
expect = "==0"
hold = []
clears_on_bind = false
note = "MAC-internal, no source at this boundary"

[[counter]]
name = "rmon.TX_FIFO_GOOD_FRAME"
family = "rmon"
read = "rmon:3"
provoke = "tx_frame_burst"
expect = ">=64"
hold = ["rmon.RX_ERROR_BAD_FCS", "rmon.RX_ERROR_BAD_FRAME", "rmon.RX_FIFO_BAD_FRAME"]
clears_on_bind = false
note = "derived from the datapath MAC-TX AXIS accepted tlast, so it is real on every integration"

[[counter]]
name = "rmon.RX_ERROR_BAD_FRAME"
family = "rmon"
read = "rmon:4"
provoke = ""
expect = "==0"
hold = []
clears_on_bind = false
note = "preamble/alignment errors need a malformed-preamble injector the bench does not have; asserted only as 'stays 0 on clean traffic'"

[[counter]]
name = "rmon.RX_ERROR_BAD_FCS"
family = "rmon"
read = "rmon:5"
provoke = ""
expect = "==0"
hold = []
clears_on_bind = false
note = "needs a bad-FCS injector (the NIC computes FCS in hardware); asserted only as 'stays 0 on clean traffic'"

[[counter]]
name = "rmon.RX_FIFO_OVERFLOW"
family = "rmon"
read = "rmon:6"
provoke = "cap_declared_unsupported"
expect = "==0"
hold = []
clears_on_bind = false
note = "deliberately NOT synthesised from AXIS backpressure - that is the precursor, not the event"

[[counter]]
name = "rmon.RX_FIFO_BAD_FRAME"
family = "rmon"
read = "rmon:7"
provoke = "runt_frame"
expect = ">=1"
hold = ["rmon.TX_FIFO_GOOD_FRAME"]
clears_on_bind = false
note = "an undersize runt is deliverable-but-flagged; BLOCKED without a raw-socket injector on the controller host"

[[counter]]
name = "rmon.RX_FIFO_GOOD_FRAME"
family = "rmon"
read = "rmon:8"
provoke = "rx_frame_burst"
expect = ">=64"
hold = ["rmon.RX_ERROR_BAD_FCS", "rmon.RX_ERROR_BAD_FRAME", "rmon.RX_FIFO_BAD_FRAME"]
clears_on_bind = false
note = "counts every frame crossing the boundary including ones BAD_FRAME flags - superset/subset, not a partition"
