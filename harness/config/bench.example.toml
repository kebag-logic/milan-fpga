#
# Milan validation + torture harness - BENCH CONFIGURATION TEMPLATE.
#
# Copy to a private path and point the harness at it:
#
#     cp harness/config/bench.example.toml ~/.config/milan-harness.toml
#     MILAN_HARNESS_CONFIG=~/.config/milan-harness.toml harness/run.sh
#
# EVERY bench-identifying value lives here and NOWHERE in the scripts: ssh
# aliases, interface names, outlet numbers, webhook URLs. The scripts read
# them; they never carry them. A value left at its placeholder makes the
# harness refuse to start rather than guess (see `milanharness/config.py`).
#
# Parsed with the standard library `tomllib` - no third-party dependency, so
# the harness starts on a bare jump host.

schema = "kebag-logic/milan-harness-config"
schema_version = "1.0.0"

# ---------------------------------------------------------------------------
[run]
# Where run directories are created. One directory per run id.
root = "./harness-runs"
# Heartbeat cadence (seconds). The heartbeat file answers "is it still alive?"
# without reading a log.
heartbeat_secs = 15
# Human log rotates at this size and the rotated part is gzipped. The JSONL is
# never rewritten - it rotates per phase instead (append-only contract).
human_log_max_bytes = 8388608
# Hard cap on captured output stored per item, in bytes. A runaway step gets
# truncated with an explicit marker, never fills the disk.
max_item_output_bytes = 262144
# The runner refuses to start a phase with less free space than this.
min_free_disk_mb = 512
# Days-long runs: keep at most this many rotated+gzipped human log parts.
human_log_keep = 40

# ---------------------------------------------------------------------------
[exec]
# Interpreter used for the analysis code that needs numpy. Empty = the same
# interpreter running the harness. numpy is NOT installed system-wide on the
# dev box; point this at a venv that has it (see harness/README.md).
python = ""
ssh = "ssh"
ssh_opts = [
    "-o", "BatchMode=yes",
    "-o", "ConnectTimeout=10",
    "-o", "ServerAliveInterval=10",
    "-o", "ServerAliveCountMax=3",
    "-o", "StrictHostKeyChecking=accept-new",
]
# Default per-command timeout (seconds) for anything not given its own.
command_timeout_s = 120

# ---------------------------------------------------------------------------
[retry]
# A board reboot, a host disconnect or a network blip must be survived, not
# aborted on. Every transport call retries with exponential backoff.
attempts = 6
backoff_initial_s = 2.0
backoff_max_s = 60.0
# Total time a single step may spend inside outages before it is declared
# BLOCKED (harness could not run it) rather than FAILED (a real defect).
outage_budget_s = 1800

# ---------------------------------------------------------------------------
[items]
# THE ITEM REGISTRY LIVES IN THE PRIVATE TEST REPOSITORY, under its
# `validation/` directory. The per-item procedures, expected values and pass
# criteria are derived from material that must not enter this repo; only the
# item IDs appear here (the repo already references IDs in
# docs/SPEC_TRACEABILITY.md). This is also better design than embedding the
# registry: the machinery and the plan version independently.
#
# Absent or unset = every item-driven phase reports BLOCKED with a clear
# reason. The harness still starts, still self-tests, and never crashes on it.
# Overridable at run time with $MILAN_HARNESS_ITEMS.
path = ""
# Optional second overlay merged on top (site-local refinements). Overlay rows
# may only refine ids the registry already has, never add or remove one.
overlay = ""

# ---------------------------------------------------------------------------
[notify]
# Called ONCE, on the FIRST transition to FAILED. Silence on success is the
# point; a notification nobody needed trains people to ignore the next one.
# BLOCKED never alerts - that is the false alarm to avoid.
#
# Field names and the POST shape follow docs/testing/TESTING.md section 6b.
# Any endpoint that accepts a POST works. The jump host has curl / notify-send
# / systemd-run but NO mail, so a webhook is the only off-site channel.
# Unset = a clean no-op, not an error. A webhook that fails to deliver is a
# logging problem and MUST NOT fail the campaign: it is timeout-bounded, its
# exit status is recorded, and the run continues either way.
alert_webhook = ""
alert_timeout_s = 10
# Optional additional local argv (e.g. notify-send). The same one-line body is
# appended as the final argument. Same never-fail-the-campaign rule.
alert_command = []

# ---------------------------------------------------------------------------
[jump]
# ssh alias of the jump host (an alias from your ssh config - never an address).
# Boards are reached THROUGH it; it also owns the power strip.
host = "JUMP_HOST_ALIAS"
# Power control command on the jump host: `<cmd> {on|off|toggle|status} <N>`.
powerstrip = "powerstrip"
# Outlets are NOT assumed to be anything. Phase 5 characterises an outlet
# (toggle, observe, restore) before any step is allowed to rely on it.
powerstrip_outlets = [0, 1, 2, 3, 4, 5]

# ---------------------------------------------------------------------------
[controller]
# The host that drives ATDECC control traffic (raw sockets, so it needs sudo
# and PACKET_MR_PROMISC). Reached directly or through the jump host.
host = "CONTROLLER_HOST_ALIAS"
via_jump = false
iface = "IFACE_NAME"
# Absolute path ON THAT HOST of the controller helper (avdecc/milan_controller.py
# deployed there). Empty disables every controller-driven item (they report
# BLOCKED, never FAILED).
controller_tool = ""
# A second controller identity, for the two-controllers-contend-for-one-entity
# races of phase 5. Empty = those items report BLOCKED.
second_controller_tool = ""

# ---------------------------------------------------------------------------
# One [[board]] table per DUT. `name` is the only board identifier used in the
# logs, so a run record never carries a hostname.
[[board]]
name = "dut-a"
ssh = "BOARD_A_SSH_ALIAS"
via_jump = true
role = "talker"
# milan_csr window base. Register OFFSETS are compiled into the harness (they
# are the stable ABI of docs/reference/REGISTER_MAP.md); only the base is here.
csr_base = 0x90000000
datapath_clk_hz = 100000000
# The VERSION word this campaign's gateware must read (phase 1 abort criterion).
version_expect = 0x00010013
n_listeners = 8
n_talkers = 8
# LiteX CSR space - these move with the build, so they are configuration.
pcm_ring_csr = 0xf0003120
mac_loopback_csr = 0xf0003818
dma_ts_offset_csr = 0xf00030a4
alsa_capture_device = "hw:0,0"
alsa_capture_channels = 2
# Optional board-side durable log mount. NOT PRESENT TODAY (no mtd node is in
# any deployed device tree - see harness/README.md "Board-side flash logging").
# Absent = the hook degrades silently to host-only logging.
user_mtd_mount = "/user"
# Power-strip outlet believed to feed this board. -1 = unknown. The harness
# characterises it before use and refuses link-event steps if it cannot.
power_outlet = -1
netif = "eth0"

[[board]]
name = "dut-b"
ssh = "BOARD_B_SSH_ALIAS"
via_jump = true
role = "listener"
csr_base = 0x90000000
datapath_clk_hz = 50000000
version_expect = 0x00010013
n_listeners = 4
n_talkers = 4
pcm_ring_csr = 0xf0003120
mac_loopback_csr = 0xf0003818
dma_ts_offset_csr = 0xf00030a4
alsa_capture_device = "hw:0,0"
alsa_capture_channels = 2
user_mtd_mount = "/user"
power_outlet = -1
netif = "eth0"

# ---------------------------------------------------------------------------
[audio]
rate_hz = 48000
# The pilot tone is EXACT-PERIOD (48 samples = 1 kHz at 48 kHz), so the capture
# is coherently sampled and the FFT takes NO window. Windowing a coherent tone
# inflates the residual and manufactures distortion.
tone_hz = 1000
capture_secs = 10
# The card accepts S32_BE only and cannot go in a WAV container.
capture_format = "S32_BE"
thdn_accept_dbfs = -120.0
thdn_reference_dbfs = -147.99

# ---------------------------------------------------------------------------
[latency]
# "In-system" latency EXCLUDES the ring-fill stage that implements the pto
# (USER decision): RX = MAC_RX->ACCEPT->DEPKT (LTAP RX d0+d1), TX mirror =
# SOF->EOF->MAC_TX (LTAP TX d1+d2). One sample at 48 kHz.
in_system_budget_us = 20.83
# Every pto in this sweep must show E2E latency == pto.
pto_sweep_us = [500, 1000, 2000]
pto_tolerance_us = 25.0

# ---------------------------------------------------------------------------
[matrix]
# Randomised per stream with a RECORDED seed. Leave at 0 to draw a fresh seed
# from the OS and record it; set it to reproduce an earlier run exactly.
seed = 0
streams_per_round = 4
rounds = 8
formats = ["aaf-pcm32"]
channel_counts = [1, 2, 4, 8]
rates_hz = [48000]
# Mapping permutations exercised per round.
mapping_modes = ["chmap-identity", "chmap-swap", "chmap-fanout"]
ring_modes = ["dram", "bram"]
loopback_modes = ["wire", "mac-loopback"]

# ---------------------------------------------------------------------------
[soak]
duration_s = 43200
assert_every_s = 300
# Counter saturation watch: a narrow saturating view reading its ceiling is a
# finding, not a value (VERSION 0x0013 saturating-view rule).
saturation_watch = true

# ---------------------------------------------------------------------------
[phase_timeout_s]
# Every phase has a timeout. A hung STEP fails that step, not the run.
baseline = 1800
smoke = 1800
validation = 14400
counters = 7200
matrix = 21600
adversarial = 14400
quality = 14400
soak = 90000
# Per-item ceiling inside a phase.
item = 600
