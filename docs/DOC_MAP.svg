<text x="40" y="56" font-size="30" font-weight="bold" fill="#263238">milan-fpga documentation — where do I start?</text>
<text x="40" y="88" font-size="15" fill="#546E7A">Pick your lane. Each column is an ordered reading journey, top to bottom. Boxes are clickable doc paths under <tspan font-weight="bold">docs/</tspan> (or the repo).</text>
<text x="40" y="112" font-size="15" fill="#546E7A">New to the project? Read the universal entry first, then follow your lane.</text>
