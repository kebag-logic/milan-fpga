<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#455A64"/></marker><marker id="arrc" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8D6E63"/></marker></defs>
<text x="40" y="44" font-size="26" font-weight="bold" fill="#263238">milan-fpga time sync - the three clocks and how they chain</text>
<text x="40" y="70" font-size="12.5" fill="#546E7A">network PHC (gPTP)  -&gt;  system clock (phc2sys)   -   PHC + CRF  -&gt;  media clock (MMCM-DRP servo)   -   CSR offsets per docs/reference/REGISTER_MAP.md   -   arrows = time/timestamp flow, not audio samples</text>
<text x="40" y="104" font-size="13" font-weight="700" fill="#1565C0">NETWORK TIME - gPTP (802.1AS, domain 0)</text>
<text x="40" y="278" font-size="13" font-weight="700" fill="#B26A00">THE HUB - PTP hardware clock (PHC) and its software consumers</text>
<text x="40" y="433" font-size="13" font-weight="700" fill="#EF6C00">AVTP TIMESTAMP CONSUMERS (presentation time against the PHC)</text>
<text x="40" y="566" font-size="13" font-weight="700" fill="#2E7D32">MEDIA CLOCK - CRF + MMCM-DRP servo (Milan v1.2 clause 7.3)</text>
<text x="40" y="584" font-size="11" font-weight="400" fill="#555555">coherent chain: capture, CRF grid and (via the servo) the listener playback clock follow one audio-MMCM lineage - loop -83.9 dB (2026-07-23, converter floor)</text>
<rect x="40" y="116" width="130" height="84" rx="9" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
<text x="105.0" y="140" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">1 GbE wire</text>
<text x="105.0" y="158" font-size="11" fill="#37474F" text-anchor="middle">802.1AS peer</text>
<text x="105.0" y="173" font-size="11" fill="#37474F" text-anchor="middle">(AVB switch / board)</text>
<rect x="205" y="116" width="150" height="84" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="280.0" y="140" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">PHY + MAC</text>
<text x="280.0" y="158" font-size="11" fill="#37474F" text-anchor="middle">RGMII/GMII</text>
<text x="280.0" y="173" font-size="11" fill="#37474F" text-anchor="middle">LiteEth or MilanMAC</text>
<rect x="390" y="116" width="250" height="84" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="515.0" y="140" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">ptp_ts_top TX+RX taps</text>
<text x="515.0" y="158" font-size="11" fill="#37474F" text-anchor="middle">latch PHC @SOP, qualify @TLAST</text>
<text x="515.0" y="173" font-size="11" fill="#37474F" text-anchor="middle">0x88F7 EVENT msgs only</text>
<rect x="675" y="116" width="200" height="84" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="775.0" y="140" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">dma-ts record ring</text>
<text x="775.0" y="158" font-size="11" fill="#37474F" text-anchor="middle">16 B {ns, seq/type/dir}</text>
<text x="775.0" y="173" font-size="11" fill="#37474F" text-anchor="middle">LiteX CSR (build/csr.csv)</text>
<rect x="910" y="116" width="190" height="84" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="1005.0" y="140" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">kl-eth driver</text>
<text x="1005.0" y="158" font-size="11" fill="#37474F" text-anchor="middle">/dev/ptp0 + SO_TIMESTAMPING</text>
<text x="1005.0" y="173" font-size="11" fill="#37474F" text-anchor="middle">matches {msgType, seq}</text>
<rect x="1135" y="116" width="180" height="84" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="1225.0" y="140" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">ptp4l</text>
<text x="1225.0" y="158" font-size="11" fill="#37474F" text-anchor="middle">BMCA + servo (softcore)</text>
<text x="1225.0" y="173" font-size="11" fill="#37474F" text-anchor="middle">ingressLatency 3511/1490 ns</text>
<rect x="1350" y="116" width="370" height="84" rx="9" fill="#ECEFF1" stroke="#455A64" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1535.0" y="140" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">silicon record (2026-07-13)</text>
<text x="1535.0" y="158" font-size="11" fill="#37474F" text-anchor="middle">peer delay 600 us (SW) -&gt; 1.3 us (HW)</text>
<text x="1535.0" y="173" font-size="11" fill="#37474F" text-anchor="middle">slave lock rms 2-4 ns through the AVB switch</text>
<rect x="40" y="290" width="330" height="96" rx="9" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="205.0" y="314" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">PHC - timestamp_counter</text>
<text x="205.0" y="332" font-size="11" fill="#37474F" text-anchor="middle">Q8.24 ns accumulator, datapath clock</text>
<text x="205.0" y="347" font-size="11" fill="#37474F" text-anchor="middle">CSR 0x500 CTRL - 0x504 INCR - 0x508 ADJ - 0x520 CMD</text>
<rect x="410" y="290" width="170" height="96" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="495.0" y="314" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">phc2sys</text>
<text x="495.0" y="332" font-size="11" fill="#37474F" text-anchor="middle">PHC -&gt; CLOCK_REALTIME</text>
<text x="495.0" y="347" font-size="11" fill="#37474F" text-anchor="middle">(softcore daemon)</text>
<rect x="615" y="290" width="185" height="96" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="707.5" y="314" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">system clock</text>
<text x="707.5" y="332" font-size="11" fill="#37474F" text-anchor="middle">Linux CLOCK_REALTIME</text>
<text x="707.5" y="347" font-size="11" fill="#37474F" text-anchor="middle">(timers, userland)</text>
<rect x="1190" y="290" width="330" height="96" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="1355.0" y="314" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">gptp2csr.sh</text>
<text x="1355.0" y="332" font-size="11" fill="#37474F" text-anchor="middle">publishes GM 0x624/0x628 - pdelay 0x6E4</text>
<text x="1355.0" y="347" font-size="11" fill="#37474F" text-anchor="middle">AS_PATH parent 0x730/0x734 (ADP/AEM truth)</text>
<rect x="40" y="445" width="300" height="76" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<text x="190.0" y="469" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">AAF packetizer</text>
<text x="190.0" y="487" font-size="11" fill="#37474F" text-anchor="middle">avtp_timestamp = ptp_now + PTO</text>
<text x="190.0" y="502" font-size="11" fill="#37474F" text-anchor="middle">(PTO: SET_STREAM_INFO acc-lat, reset 2 ms)</text>
<rect x="380" y="445" width="300" height="76" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<text x="530.0" y="469" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">AVTP RX monitor</text>
<text x="530.0" y="487" font-size="11" fill="#37474F" text-anchor="middle">ts_delta 0x6EC = avtp_ts - ptp_now</text>
<text x="530.0" y="502" font-size="11" fill="#37474F" text-anchor="middle">LATE / EARLY counters</text>
<rect x="1430" y="445" width="290" height="76" rx="9" fill="#ECEFF1" stroke="#455A64" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1575.0" y="469" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">media-lock rule</text>
<text x="1575.0" y="487" font-size="11" fill="#37474F" text-anchor="middle">internal source: lock on first valid PDU</text>
<text x="1575.0" y="502" font-size="11" fill="#37474F" text-anchor="middle">external (CRF): lock only when servo converged</text>
<rect x="40" y="596" width="230" height="96" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
