<text x="352" y="252" font-size="12.5" fill="#37474F" font-style="italic">{pair_valid, pair_slot, L, R}</text>
<text x="352" y="268" font-size="12.5" fill="#37474F" font-style="italic">one shared contract</text>
<text x="440" y="430" font-size="12" fill="#6A1B9A">pb_enable replaces the ADC frontend wholesale;</text>
<text x="440" y="446" font-size="12" fill="#6A1B9A">the RING map source picks ring pairs per slot</text>
<text x="620" y="600" font-size="13.5" font-weight="bold" fill="#8D6E63">AAF-PCM PDUs with presentation time (avtp_timestamp) - the reference AVB switch forwards per the lwSRP reservation</text>
<rect x="60" y="170" width="268" height="78" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="72" y="192" font-size="14.5" font-weight="bold" fill="#212121">KL_aaf_capture_i2s</text>
<text x="72" y="210" font-size="11.8" fill="#37474F">Pmod I2S2 ADC (CS5343), I2S master</text>
<text x="72" y="225" font-size="11.8" fill="#37474F">24.576 MHz MMCM /512 = 48 kHz, slot 0</text>
<rect x="60" y="262" width="268" height="78" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="72" y="284" font-size="14.5" font-weight="bold" fill="#212121">KL_tdm_capture</text>
<text x="72" y="302" font-size="11.8" fill="#37474F">TDM slave, 8/16/32 slots</text>
<text x="72" y="317" font-size="11.8" fill="#37474F">pair k = TDM slots {2k, 2k+1}</text>
<rect x="60" y="354" width="268" height="78" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="72" y="376" font-size="14.5" font-weight="bold" fill="#212121">KL_pcm_tx  (ALSA playback)</text>
<text x="72" y="394" font-size="11.8" fill="#37474F">host-written PCM ring, S32BE</text>
<text x="72" y="409" font-size="11.8" fill="#37474F">pb_* CSRs; underrun repeat/silence</text>
<rect x="60" y="446" width="268" height="78" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="72" y="468" font-size="14.5" font-weight="bold" fill="#212121">KL_tone_gen</text>
<text x="72" y="486" font-size="11.8" fill="#37474F">1 kHz 0 dBFS, 48-entry table</text>
<text x="72" y="501" font-size="11.8" fill="#37474F">TONE_CTRL 0x6DC</text>
<rect x="440" y="288" width="268" height="116" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="452" y="310" font-size="14.5" font-weight="bold" fill="#212121">KL_chan_map_capture</text>
<text x="452" y="328" font-size="11.8" fill="#37474F">32-slot map RAM {en, src, idx}</text>
<text x="452" y="343" font-size="11.8" fill="#37474F">src: I2S / TDM / RING / TONE / zero</text>
<text x="452" y="358" font-size="11.8" fill="#37474F">CSR 0x900 window (bypass = legacy)</text>
<rect x="812" y="288" width="292" height="116" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="824" y="310" font-size="14.5" font-weight="bold" fill="#212121">KL_aaf_packetizer</text>
<text x="824" y="328" font-size="11.8" fill="#37474F">TCTX xN talkers, 6 samples/ch per PDU</text>
<text x="824" y="343" font-size="11.8" fill="#37474F">payload 24*C B, frame 42+24*C B</text>
<text x="824" y="358" font-size="11.8" fill="#37474F">avtp_timestamp = PHC ns + transit offset</text>
<text x="824" y="373" font-size="11.8" fill="#37474F">AAF_CTRL 0x654 + 0x800 TCTX window</text>
<rect x="812" y="130" width="220" height="64" rx="9" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
<text x="824" y="152" font-size="14.5" font-weight="bold" fill="#212121">host TX DMA</text>
<text x="824" y="170" font-size="11.8" fill="#37474F">kl-eth frames from Linux</text>
<rect x="1076" y="130" width="250" height="64" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<text x="1088" y="152" font-size="14.5" font-weight="bold" fill="#212121">classify + CBS shaper</text>
<text x="1088" y="170" font-size="11.8" fill="#37474F">traffic_controller_802_1q</text>
<rect x="1370" y="130" width="220" height="64" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<text x="1382" y="152" font-size="14.5" font-weight="bold" fill="#212121">ptp_ts_top (TX)</text>
<text x="1382" y="170" font-size="11.8" fill="#37474F">egress HW timestamp</text>
<rect x="1208" y="288" width="268" height="116" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<text x="1220" y="310" font-size="14.5" font-weight="bold" fill="#212121">post-shaper inject</text>
<text x="1220" y="328" font-size="11.8" fill="#37474F">adp_tx_arbiter aaf_final_mux</text>
<text x="1220" y="343" font-size="11.8" fill="#37474F">AAF joins AFTER the CBS queue;</text>
<text x="1220" y="358" font-size="11.8" fill="#37474F">bandwidth held by the lwSRP</text>
<text x="1220" y="373" font-size="11.8" fill="#37474F">admission gate (0x680 group)</text>
<rect x="1580" y="300" width="190" height="92" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<text x="1592" y="322" font-size="14.5" font-weight="bold" fill="#212121">MAC TX</text>
<text x="1592" y="340" font-size="11.8" fill="#37474F">RGMII, VLAN SR class</text>
<text x="1592" y="355" font-size="11.8" fill="#37474F">VID from AAF_CTRL[27:16]</text>
<rect x="1880" y="296" width="300" height="100" rx="9" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="1892" y="318" font-size="14.5" font-weight="bold" fill="#212121">the wire</text>
<text x="1892" y="336" font-size="11.8" fill="#37474F">AAF-PCM class A, 8000 PDU/s @48 k</text>
<text x="1892" y="351" font-size="11.8" fill="#37474F">DMAC = MAAP claim, VLAN SR VID</text>
<text x="1892" y="366" font-size="11.8" fill="#37474F">presentation time rides every PDU</text>
<rect x="60" y="760" width="200" height="92" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<text x="72" y="782" font-size="14.5" font-weight="bold" fill="#212121">MAC RX</text>
<text x="72" y="800" font-size="11.8" fill="#37474F">ptp_ts_top RX stamp</text>
<text x="72" y="815" font-size="11.8" fill="#37474F">TCAM DMAC filter</text>
<rect x="320" y="760" width="268" height="92" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="332" y="782" font-size="14.5" font-weight="bold" fill="#212121">avtp_stream_parser</text>
<text x="332" y="800" font-size="11.8" fill="#37474F">+ KL_stream_table: wire-truth</text>
<text x="332" y="815" font-size="11.8" fill="#37474F">stream_id match (entry 0 =</text>
<text x="332" y="830" font-size="11.8" fill="#37474F">ACMP-bound record)</text>
<rect x="648" y="748" width="296" height="116" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="660" y="770" font-size="14.5" font-weight="bold" fill="#212121">KL_avtp_rx_monitor_ctx</text>
<text x="660" y="788" font-size="11.8" fill="#37474F">lock on 1st valid PDU, 8-PDU settle,</text>
<text x="660" y="803" font-size="11.8" fill="#37474F">100 ms silence unlock, format compare</text>
<text x="660" y="818" font-size="11.8" fill="#37474F">0x6B8/0x6BC/0x6C0 - ts_delta 0x6EC</text>
<rect x="1004" y="748" width="280" height="116" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="1016" y="770" font-size="14.5" font-weight="bold" fill="#212121">KL_aaf_rx_depacketizer</text>
<text x="1016" y="788" font-size="11.8" fill="#37474F">S32BE payload, 1 AXIS frame/PDU,</text>
<text x="1016" y="803" font-size="11.8" fill="#37474F">tuser = stream; commits only on the</text>
<text x="1016" y="818" font-size="11.8" fill="#37474F">monitor accept pulse - PCMRX_CNT 0x6C4</text>
<rect x="1344" y="760" width="240" height="92" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="1356" y="782" font-size="14.5" font-weight="bold" fill="#212121">KL_pcm_route</text>
<text x="1356" y="800" font-size="11.8" fill="#37474F">per-stream flags {RENDER, DMA}</text>
<text x="1356" y="815" font-size="11.8" fill="#37474F">reset: stream 0 = RENDER|DMA</text>
<rect x="1240" y="950" width="320" height="104" rx="9" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
<text x="1252" y="972" font-size="14.5" font-weight="bold" fill="#212121">PCM DMA ring</text>
<text x="1252" y="990" font-size="11.8" fill="#37474F">DRAM _PCMRingNxN (LiteX 0xf0003120)</text>
<text x="1252" y="1005" font-size="11.8" fill="#37474F">or on-chip BRAM --pcm-ring bram</text>
<text x="1252" y="1020" font-size="11.8" fill="#37474F">(0x9010_0000, sink.ready == 1)</text>
<rect x="1240" y="1104" width="320" height="78" rx="9" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
<text x="1252" y="1126" font-size="14.5" font-weight="bold" fill="#212121">ALSA capture / PipeWire</text>
<text x="1252" y="1144" font-size="11.8" fill="#37474F">snd-kl-milan + pw-milan-ring-source</text>
<text x="1252" y="1159" font-size="11.8" fill="#37474F">(private test repo)</text>
<rect x="1660" y="700" width="220" height="78" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="1672" y="722" font-size="14.5" font-weight="bold" fill="#212121">KL_pcm_lpf</text>
<text x="1672" y="740" font-size="11.8" fill="#37474F">20 kHz Butterworth biquad</text>
<text x="1672" y="755" font-size="11.8" fill="#37474F">serial-MAC, ~12 clk/pair</text>
<text x="1672" y="770" font-size="11.8" fill="#37474F">LPF_P=0 PRUNES it (ax7101 does)</text>
<rect x="1948" y="700" width="268" height="78" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="1960" y="722" font-size="14.5" font-weight="bold" fill="#212121">KL_i2s_playback</text>
<text x="1960" y="740" font-size="11.8" fill="#37474F">CS4344 DAC, clean-clock free-run</text>
<text x="1960" y="755" font-size="11.8" fill="#37474F">I2SPB_STAT 0x6D8, wire-truth chans</text>
<rect x="1660" y="812" width="220" height="92" rx="9" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<text x="1672" y="834" font-size="14.5" font-weight="bold" fill="#212121">KL_chan_map_render</text>
<text x="1672" y="852" font-size="11.8" fill="#37474F">64 stream-ch -&gt; 10 phys</text>
<text x="1672" y="867" font-size="11.8" fill="#37474F">wire-truth channels_per_frame</text>
<text x="1672" y="882" font-size="11.8" fill="#37474F">CSR 0x900 window</text>
<rect x="1948" y="812" width="268" height="92" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="1960" y="834" font-size="14.5" font-weight="bold" fill="#212121">KL_tdm_render</text>
<text x="1960" y="852" font-size="11.8" fill="#37474F">TDM8 out, lane 0 slots 0..7</text>
<text x="1960" y="867" font-size="11.8" fill="#37474F">double-buffered frames</text>
<circle cx="400" cy="346" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="400" y="333" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">CAP</text>
<circle cx="1130" cy="320" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="1130" y="307" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">PKT_SOF</text>
<circle cx="1130" cy="372" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="1130" y="359" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">PKT_EOF</text>
<circle cx="1800" cy="346" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="1800" y="333" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">MAC_TX</text>
<circle cx="290" cy="806" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="290" y="793" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">MAC_RX</text>
<circle cx="970" cy="806" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="970" y="793" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">ACCEPT</text>
<circle cx="1310" cy="806" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="1310" y="793" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">DEPKT</text>
<circle cx="1420" cy="920" r="9" fill="#F9A825" stroke="#795548" stroke-width="1.4"/>
<text x="1420" y="907" font-size="11.5" font-weight="bold" fill="#795548" text-anchor="middle">PCM_RING</text>
<rect x="60" y="940" width="1080" height="150" rx="10" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.4"/>
<text x="76" y="966" font-size="14" font-weight="bold" fill="#212121">Legend</text>
<rect x="76" y="980" width="26" height="18" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
<text x="112" y="994" font-size="12.5" fill="#37474F">physical audio I/O (ADC/DAC/TDM) + ring sources</text>
<rect x="616" y="980" width="26" height="18" rx="4" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="652" y="994" font-size="12.5" fill="#37474F">channel-map fabric: capture mux / render crossbar / route</text>
<rect x="76" y="1010" width="26" height="18" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
<text x="112" y="1024" font-size="12.5" fill="#37474F">AAF engines: packetizer - parser - monitor - depacketizer</text>
<rect x="616" y="1010" width="26" height="18" rx="4" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.6"/>
<text x="652" y="1024" font-size="12.5" fill="#37474F">egress/ingress boundary: CBS shaper, PTP timestamps, MAC</text>
<rect x="76" y="1040" width="26" height="18" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="1.6"/>
<text x="112" y="1054" font-size="12.5" fill="#37474F">PCM ring storage (DRAM default, BRAM option)</text>
<rect x="616" y="1040" width="26" height="18" rx="4" fill="#ECEFF1" stroke="#455A64" stroke-width="1.6"/>
<text x="652" y="1054" font-size="12.5" fill="#37474F">software side (Linux driver / PipeWire)</text>
<circle cx="89" cy="1079" r="8" fill="#F9A825" stroke="#795548"/>
<text x="112" y="1083" font-size="12.5" fill="#37474F">latency tap (docs/AAF_LATENCY_TAPS.md stage; deltas at CSR 0x870, history ring per docs/LATENCY_HISTORY_RING.md)</text>
