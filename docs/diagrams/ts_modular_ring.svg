<text x="720.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">The 4.294967296 s ring, and the half-range convention that reads it</text>
<text x="720.0" y="57" text-anchor="middle" font-size="13" fill="#666">avtp_timestamp is a 32-bit UNSIGNED absolute time - the listener compares it modulo 2^32 and splits the result at 2^31</text>
