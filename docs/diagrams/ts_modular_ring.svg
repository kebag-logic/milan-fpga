<text x="1085.0" y="680.0" text-anchor="middle" font-size="11" fill="#666">KL_avtp_rx_monitor.sv - the signed cast of an unsigned modular difference IS this convention</text>
<rect x="40" y="712" width="1360" height="66" rx="8" fill="#f6f0fa" stroke="#7a4fa3" stroke-width="2.0"/>
<text x="720.0" y="743.0" text-anchor="middle" font-size="14" font-weight="700" fill="#4a2d66">the listener is not measuring a wrong offset - it is measuring a meaningless one, correctly</text>
<text x="720.0" y="758.0" text-anchor="middle" font-size="11" fill="#5b4272">once the true separation exceeds one lap, the modular difference carries NO information about the direction or the magnitude of the clock error; at 50,395 laps it is simply a point on the ring</text>
