<text x="500" y="742" font-size="11.5" fill="#546E7A">out of the datapath</text>
<text x="76" y="759" font-size="11.5" font-family="monospace" fill="#263238">AXIS stream CDC</text>
<text x="256" y="759" font-size="11.5" font-family="monospace" fill="#37474F">mac_rx_cdc</text>
<text x="500" y="759" font-size="11.5" fill="#546E7A">into the datapath</text>
<text x="76" y="776" font-size="11.5" font-family="monospace" fill="#263238">AXI-Lite CDC</text>
<text x="256" y="776" font-size="11.5" font-family="monospace" fill="#37474F">milan_axil_cdc</text>
<text x="500" y="776" font-size="11.5" fill="#546E7A">the whole CSR register ABI, sys to cd_milan</text>
<text x="76" y="793" font-size="11.5" font-family="monospace" fill="#263238">MultiReg 2-FF</text>
<text x="256" y="793" font-size="11.5" font-family="monospace" fill="#37474F">x2 call sites</text>
<text x="500" y="793" font-size="11.5" fill="#546E7A">single-bit status/IRQ levels (incl. the CSR IRQ to sys)</text>
<rect x="60" y="838" width="1342" height="92" rx="9" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
<text x="76" y="864" font-size="14.5" font-weight="bold" fill="#B71C1C">What this census can and cannot prove</text>
<text x="76" y="888" font-size="12" fill="#B71C1C">It proves every crossing built from one of the four primitives is drawn here, with the clock nets the RTL itself connects.</text>
<text x="76" y="906" font-size="12" fill="#B71C1C">It CANNOT prove a signal is not crossing a domain some other way - a bare assignment between two clocked processes is</text>
<text x="76" y="924" font-size="12" fill="#B71C1C">invisible to this parse and to simulation alike. That is what the constraint files and the synthesis CDC report are for.</text>
