<svg xmlns="http://www.w3.org/2000/svg" width="2002" height="735" viewBox="0 0 2002 735" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="fa" markerWidth="16" markerHeight="16" refX="4" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#455A64"/></marker></defs>
<rect width="2002" height="735" fill="#FAFAFA"/>
<text x="40" y="56" font-size="30" font-weight="bold" fill="#263238">Build → Flash → Boot → Verify — the AX7101 pipeline</text>
<text x="40" y="88" font-size="15" fill="#546E7A">One flow, four stages. Each stage lists the real commands (bold) and the load-bearing rules. Details: docs/integration/BUILDING · LITEX_SOC · QSPI_FLASHBOOT.</text>
<text x="40" y="112" font-size="15" fill="#546E7A">Persistent writes require two exact build identities: live-proven installed BIT/LAYOUT and one fully prepared target set.</text>
<rect x="40" y="150" width="440" height="369" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<rect x="40" y="150" width="440" height="56" rx="10" fill="#2E7D32" stroke="#2E7D32"/>
<rect x="40" y="194" width="440" height="12" fill="#2E7D32"/>
<text x="58" y="177" font-size="19" font-weight="bold" fill="#ffffff">1 · BUILD</text>
<text x="58" y="195" font-size="12.5" fill="#ffffff" fill-opacity="0.92">dev host · Vivado</text>
<rect x="52" y="218" width="416" height="30" rx="5" fill="#263238"/>
<text x="61" y="238" font-size="12.5" font-family="Menlo,Consolas,monospace" fill="#B9F6CA">sw/litex/build.sh ax7101</text>
<text x="58" y="275" font-size="13" fill="#37474F">--software-profile baremetal</text>
<text x="58" y="312" font-size="13" fill="#37474F">--fabric-gptp --full</text>
<rect x="52" y="329" width="416" height="30" rx="5" fill="#263238"/>
<text x="61" y="349" font-size="12.5" font-family="Menlo,Consolas,monospace" fill="#B9F6CA">--with-spiflash --flashboot baremetal</text>
<text x="58" y="386" font-size="13" fill="#37474F">generated AEM + gPTP ROM from one YAML</text>
<text x="58" y="423" font-size="13" fill="#37474F">3×32-thread seed sweep</text>
<text x="58" y="460" font-size="13" fill="#37474F">GATE: WNS ≥ 0</text>
<rect x="40" y="541" width="440" height="64" rx="8" fill="#ffffff" stroke="#2E7D32" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="54" y="561" font-size="11.5" font-weight="bold" fill="#2E7D32">OUTPUT</text>
<text x="54" y="579" font-size="12.5" fill="#212121">gateware .bit + raw aem_desc.bin</text>
<text x="54" y="596" font-size="12.5" fill="#212121">(no second-stage boot images)</text>
<line x1="486" y1="334" x2="526" y2="334" stroke="#455A64" stroke-width="3.5" marker-end="url(#fa)"/>
<rect x="534" y="150" width="440" height="369" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
<rect x="534" y="150" width="440" height="56" rx="10" fill="#EF6C00" stroke="#EF6C00"/>
<rect x="534" y="194" width="440" height="12" fill="#EF6C00"/>
<text x="552" y="177" font-size="19" font-weight="bold" fill="#ffffff">2 · FLASH</text>
<text x="552" y="195" font-size="12.5" fill="#ffffff" fill-opacity="0.92">JTAG → QSPI (16 MB)</text>
<rect x="546" y="218" width="416" height="30" rx="5" fill="#263238"/>
<text x="555" y="238" font-size="12.5" font-family="Menlo,Consolas,monospace" fill="#B9F6CA">INSTALLED_BUILD=&lt;old&gt; build.sh flash ax7101:&lt;new&gt;</text>
<text x="552" y="275" font-size="13" fill="#37474F">live-read QSPI@0; match exact old/new .bit</text>
<text x="552" y="312" font-size="13" fill="#37474F">prepare target; CRC-check the live image set</text>
<text x="552" y="349" font-size="13" fill="#37474F">software/full→fabric/bare: bit, then AEM</text>
<text x="552" y="386" font-size="13" fill="#37474F">every write uses --verify</text>
<text x="552" y="423" font-size="13" fill="#37474F">retry recognizes source or target commit bit</text>
<text x="552" y="460" font-size="13" fill="#37474F">direct partial writes: recovery escape only</text>
<text x="552" y="497" font-size="13" fill="#37474F">boundary: torn offset-zero write needs A/B</text>
<rect x="534" y="541" width="440" height="64" rx="8" fill="#ffffff" stroke="#EF6C00" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="548" y="561" font-size="11.5" font-weight="bold" fill="#EF6C00">OUTPUT</text>
<text x="548" y="579" font-size="12.5" fill="#212121">persistent QSPI image:</text>
<text x="548" y="596" font-size="12.5" fill="#212121">bitstream@0 · paired raw AEM image</text>
<line x1="980" y1="334" x2="1020" y2="334" stroke="#455A64" stroke-width="3.5" marker-end="url(#fa)"/>
<rect x="1028" y="150" width="440" height="369" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<rect x="1028" y="150" width="440" height="56" rx="10" fill="#1565C0" stroke="#1565C0"/>
<rect x="1028" y="194" width="440" height="12" fill="#1565C0"/>
<text x="1046" y="177" font-size="19" font-weight="bold" fill="#ffffff">3 · BOOT</text>
<text x="1046" y="195" font-size="12.5" fill="#ffffff" fill-opacity="0.92">on target · self-configures</text>
<rect x="1040" y="218" width="416" height="30" rx="5" fill="#263238"/>
<text x="1049" y="238" font-size="12.5" font-family="Menlo,Consolas,monospace" fill="#B9F6CA">power on / power-cycle</text>
<text x="1046" y="275" font-size="13" fill="#37474F">FPGA config-boots from QSPI</text>
<text x="1046" y="312" font-size="13" fill="#37474F">LiteX BIOS → RV32 firmware in ROM</text>
<text x="1046" y="349" font-size="13" fill="#37474F">AEM length + CRC verified into DRAM</text>
<text x="1046" y="386" font-size="13" fill="#37474F">entity enables only after valid AEM</text>
<text x="1046" y="423" font-size="13" fill="#37474F">fabric gPTP owns PHC + publication</text>
<text x="1046" y="460" font-size="13" fill="#37474F">one firmware image · one time owner · no mirrors</text>
<rect x="1028" y="541" width="440" height="64" rx="8" fill="#ffffff" stroke="#1565C0" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="1042" y="561" font-size="11.5" font-weight="bold" fill="#1565C0">OUTPUT</text>
<text x="1042" y="579" font-size="12.5" fill="#212121">cacheless RV32 bare-metal control,</text>
<text x="1042" y="596" font-size="12.5" fill="#212121">Milan fabric live</text>
<line x1="1474" y1="334" x2="1514" y2="334" stroke="#455A64" stroke-width="3.5" marker-end="url(#fa)"/>
<rect x="1522" y="150" width="440" height="369" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
<rect x="1522" y="150" width="440" height="56" rx="10" fill="#6A1B9A" stroke="#6A1B9A"/>
<rect x="1522" y="194" width="440" height="12" fill="#6A1B9A"/>
<text x="1540" y="177" font-size="19" font-weight="bold" fill="#ffffff">4 · VERIFY</text>
<text x="1540" y="195" font-size="12.5" fill="#ffffff" fill-opacity="0.92">on the bench</text>
<rect x="1534" y="218" width="416" height="30" rx="5" fill="#263238"/>
<text x="1543" y="238" font-size="12.5" font-family="Menlo,Consolas,monospace" fill="#B9F6CA">baremetal_uart_smoke.py --port &lt;UART&gt;</text>
<text x="1540" y="275" font-size="13" fill="#37474F">UART reports VERSION 0x00020056 + gPTP state</text>
<rect x="1534" y="292" width="416" height="30" rx="5" fill="#263238"/>
<text x="1543" y="312" font-size="12.5" font-family="Menlo,Consolas,monospace" fill="#B9F6CA">focused RTL + processor suites</text>
<text x="1540" y="349" font-size="13" fill="#37474F">traceability + builder gates</text>
<text x="1540" y="386" font-size="13" fill="#37474F">#117: physical / two-board pending</text>
<text x="1540" y="423" font-size="13" fill="#37474F">REGISTER_MAP.md = the ABI</text>
<text x="1540" y="460" font-size="13" fill="#37474F">#117 records topology + raw evidence</text>
<rect x="1522" y="541" width="440" height="64" rx="8" fill="#ffffff" stroke="#6A1B9A" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="1536" y="561" font-size="11.5" font-weight="bold" fill="#6A1B9A">OUTPUT</text>
<text x="1536" y="579" font-size="12.5" fill="#212121">digitally validated candidate;</text>
<text x="1536" y="596" font-size="12.5" fill="#212121">physical acceptance stays on #117</text>
<rect x="40" y="639" width="1922" height="72" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
<text x="60" y="665" font-size="15" font-weight="bold" fill="#C62828">↩ Recovery — the board is not a brick</text>
<text x="60" y="687" font-size="12.8" fill="#37474F">retry flash-pair with the same installed reference (source/target commit bits are recognized) · JTAG-load to SRAM tests without persistent writes</text>
<text x="60" y="705" font-size="12.8" fill="#37474F">a torn offset-zero erase/program needs physical recovery or A/B MultiBoot  ·  full field log: docs/limitations/TROUBLESHOOTING.md</text>
</svg>