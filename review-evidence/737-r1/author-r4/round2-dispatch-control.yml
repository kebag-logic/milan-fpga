name: Dependency control
on: push
jobs:
  long:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo LONG_START
          for attempt in $(seq 1 100); do
            if test -f "$CONTROL_OUTPUT/dependent"; then
              echo LONG_FINISH
              exit 0
            fi
            sleep 0.1
          done
          exit 1
  short:
    runs-on: ubuntu-latest
    steps:
      - run: echo SHORT_FINISH
  dependent:
    needs: short
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo DEPENDENT_START
          touch "$CONTROL_OUTPUT/dependent"
