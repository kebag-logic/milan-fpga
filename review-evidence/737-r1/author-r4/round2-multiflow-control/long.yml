name: Independent workflow
on: push
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo LONG_START
          touch "$CONTROL_OUTPUT/long-started"
          for attempt in $(seq 1 100); do
            if test -f "$CONTROL_OUTPUT/dependent"; then
              echo LONG_FINISH
              exit 0
            fi
            sleep 0.1
          done
          exit 1
