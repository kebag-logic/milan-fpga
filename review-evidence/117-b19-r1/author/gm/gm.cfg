# Lane B1 software grandmaster on the controller host (#387 acceptance 4,
# owner decision 2026-09-28): the linuxptp gPTP profile with a better
# priority1 than the current grandmaster (246) and a free-running PHC.
[global]
gmCapable		1
priority1		240
priority2		248
free_running		1
logAnnounceInterval	0
logSyncInterval		-3
syncReceiptTimeout	3
neighborPropDelayThresh	800
min_neighbor_prop_delay	-20000000
assume_two_step		1
path_trace_enabled	1
follow_up_info		1
transportSpecific	0x1
ptp_dst_mac		01:80:C2:00:00:0E
network_transport	L2
delay_mechanism		P2P
tx_timestamp_timeout	50
