# Reviewer-written end-station configuration, NOT the author's file.
# Derived from the public board support repository's
# milan-linux/config/endstation_pb2_bridge.yaml (branch pb2-aecp-1 at a5cd7c1e)
# and changed only by the facts tsn-c-stack docs/POCKETBEAGLE.md states:
# four AAF streams each way of 8, 8, 4 and 4 channels, a CRF stream each way,
# clock sources internal, CRF and each AAF input, 24 USB channels each way,
# the pinned model ID 0x001BC5C52E47A158 and, new in round 2, the locale en-US.
schema: kebag-logic/milan-endstation-config
schema_version: "1.3.0"

entity:
  name: "PocketBeagle 2 bridge"
  entity_model_id: hash-derived
  model_id_pin: "0x001BC5C52E47A158"
  entity_id: mac-derived
  vendor_name: "Kebag Logic"
  locale: "en-US"
  serial_number: ""
  group_name: ""

board:
  target: host
  gptp_owner: host-phc
  constraints:
    link_mbps: 1000

platform:
  mac_address: "02:00:00:00:00:01"

control:
  placement: split

gptp:
  priority1: 248
  priority2: 248
  clock_class: 248
  clock_accuracy: 0xFE
  offset_scaled_log_variance: 0xFFFF
  domain: 0
  log_sync_interval: -3
  log_announce_interval: 0
  log_pdelay_interval: 0
  port_number: 1

clocking:
  sampling_rate_hz: 48000
  audio_unit_rates_hz: [48000]
  media_clock_sources: [internal, crf, input_stream]
  default_source: internal
  crf_sink: true
  crf_output:
    enabled: true

audio_interface:
  kind: usb_audio
  channels: 24
  word_length_bits: 32

streams:
  listeners:
    - { name: "Stream In 0", channels: 8 }
    - { name: "Stream In 1", channels: 8 }
    - { name: "Stream In 2", channels: 4 }
    - { name: "Stream In 3", channels: 4 }
  talkers:
    - { name: "Stream Out 0", channels: 8 }
    - { name: "Stream Out 1", channels: 8 }
    - { name: "Stream Out 2", channels: 4 }
    - { name: "Stream Out 3", channels: 4 }
