#
# The Arty A7-100T's split configuration at 4x4/1if (#1027): four AAF talkers
# and four AAF listeners on the one 100 Mb/s interface, with the CRF input
# and the CRF output Milan v1.2 7.2.3 requires once two AAF inputs exist.
# It is endstation_arty_split's shape four times over, built at
# control.placement: split. The Philips-stereo I2S render on the Pmod I2S2
# backs the first talker and the first listener; the other talkers frame
# silence and the other listeners render nothing physical.
#
# THE 100 Mb/s ENVELOPE (Milan v1.2 4.3.3.2 Table 4.4, against the 75 %
# class-A limit of 802.1Q 34.3.1, 75,000 kb/s on each direction):
#   egress: four 2-channel 48 kHz talkers at 7,360 kb/s and the CRF output at
#   5,632 kb/s reserve 35,072 kb/s. The framer is stereo, so the talkers
#   advertise only that format and SET_STREAM_FORMAT refuses any other.
#   ingress: Milan 6.4 makes each Stream Input advertise the whole 48 kHz
#   family; four 8-channel inputs at 16,576 kb/s and the CRF input reserve
#   71,936 kb/s, inside the limit. No 96 or 192 kHz Stream Input format is
#   advertised: 6.4 would then owe their 8-channel formats, and four of those
#   (28,864 and 53,440 kb/s) exceed the limit.
#
# Generate this shape through the split recipe:
#   BUILD_CFG=configs/endstation_arty_split_4x4.yaml sw/litex/build.sh arty
# The CPU and sys share 100 MHz (the 800 MHz VCO / 8); the datapath runs at 50 MHz.
# The runtime latency pair resets to 1409/100 ns, measured at an 80 MHz system
# clock (#829); its figure at this image's 100 MHz is owed to the bench.
# No tap compensation is included in this configuration.

schema: kebag-logic/milan-endstation-config
schema_version: "1.2.0"

control:
  placement: split

entity:
  name: "Milan FPGA 4x4"
  entity_model_id: hash-derived      # EUI-64 from the model shape (recipe in
                                     # sw/builder/README-parameters.md). No
                                     # pin: nothing is flashed with this shape.
  entity_id: mac-derived             # EUI-64 from station MAC (MAC48->FF-FE)
  vendor_name: "Kebag Logic"
  # NO firmware_version KEY - it is DERIVED, not declared. The version lives
  # in hdl/common/csr/milan_csr.sv's `parameter logic [31:0] VERSION` (the
  # read-only 0x004 register, whose //! comment IS the gateware changelog),
  # and the ENTITY descriptor renders it as major.minor.rev:
  # [31:16].[15:0].firmware_rev, so 0x0001_0016 -> "1.22.0". Until
  # 2026-07-28 this key said "0.1.0" in all three configs while the fabric
  # was at 0x0001_0016, so every board we ship told Hive - and every other
  # controller on the segment - that it ran firmware 0.1.0. Same shape as
  # the ADP shape defect: a hand-typed declaration nothing could compare
  # against the fabric. The builder now refuses the key rather than
  # preferring one of two answers; `firmware_rev: N` (optional, default 0)
  # is the lever for a respin that changes no CSR ABI.
  serial_number: "ARTY-0001"
  group_name: ""

board:
  target: arty                       # arty | ax7101
  features:
    fabric_gptp: true               # the one product owner (#259)
  constraints:                       # physical facts -> milan_soc.py argv
    sys_clk_hz: 100000000            # the board PLL's 800 MHz VCO / 8
    milan_clk_hz: 50000000           # dense datapath in its own 50 MHz domain
    l2_bytes: 0                      # #259 bare-metal cacheless product
    phy: mii-100                     # DP83848 MII (arty) | gmii-1g (ax7101)
    gtx_tx_invert: false             # GMII-only knob (ax7101)
    floorplan: false
    flashboot: baremetal             # #259: the {bitstream, aem} manifest (S25FL128S QSPI)
    uart_baudrate: 115200
    num_queues: 5                    # 802.1Q shaper queues =
                                     # ethernet_packet_pkg::NUMBER_OF_QUEUES
                                     # (q5 class A .. q0 best effort - see
                                     # docs/reference/EGRESS_QUEUE_MAP.md)
    # eth_port: only for multi-PHY boards (ax7101 e1|e2); arty has one PHY

srp:                                 # lwSRP (802.1Q MSRP/MVRP) reservation
                                     # table -> CSR 0x680 group. Every value
                                     # here is the DEPLOYED reset word; the
                                     # builder gates 18a/18b parse
                                     # hdl/common/csr/milan_csr.sv and
                                     # hdl/ieee8021q/srp/lwsrp_pkg.sv and
                                     # assert the emission matches, so a hand
                                     # edit on either side fails the build.
  sr_class: A                        # Milan v1.2 5.6: class A only
  vid: 2                             # THE SR VID (VID 0 floods unshaped)
  stream_dmac_base: "0x91E0F000FE01" # MAAP range 91:E0:F0:00:FE:01
  accumulated_latency_ns: 0          # constant until measured
  class_queue: 4                     # LWSRP_CTRL[4:2], reset PCP3->TC3->q4
                                     # (802.1Q order: q5 = SR class A, the
                                     # top of the 6-queue egress map)
  enable_at_reset: false             # LWSRP_CTRL[0]
  talker_declare_at_reset: false     # LWSRP_CTRL[1]
  bandwidth_limit_pct: 75            # Milan 5.6 / 802.1Q 34.3.1
  # MILAN v1.2 4.2.7.1.1 Table 4.3 supersedes 802.1Q Table 10-7 for a PAAD:
  # LeaveTime 5000 ms, not 600. These words are emitted into the generated CSR
  # defaults and programmed into the engine, so a stale 600 here would undo
  # the RTL's corrected MRP timer reset.
  timers_ms: { join: 200, leave: 5000, leaveall: 10000 }
  tspec:
    policy: derived                  # pinned 224 until 2026-07-28: a
                                     # hand-picked "conservative" value that
                                     # over-reserved the 2ch stream ~3x and
                                     # contradicted 802.1Q 35.2.2.8.4 a) -
                                     # MaxFrameSize is "the maximum frame
                                     # size that the Talker WILL PRODUCE",
                                     # and this talker produces the 90-byte
                                     # wire frame (MSDU 72, tap-measured).
                                     # The pin's only stated reason was
                                     # "changing it needs a reflash"; this
                                     # image's reflash carries it. derived
                                     # follows the WIRE constant
                                     # (framer_wire_channels) end to end.
    max_frame_bytes: 224             # LWSRP_TSPEC[15:0]
    interval_frames: 1               # LWSRP_TSPEC[31:16]
  rtl_table: false                   # endstation_arty_current owns the
                                     # tracked CSR reset header

platform:                            # identity + processor-memory placement
  mac_address: "02:4b:4c:4b:4c:02"   # #840: the Arty's decided prototype identity
                                     # locally administered, not IEEE-assigned
  pp_mem_phys: 0x4fe00000            # 1 MiB protocol-processor window

clocking:
  sampling_rate_hz: 48000            # current media clock (AAF base rate)
  audio_unit_rates_hz: [48000]       # 48 kHz only: the render path runs no other
                                     # rate, and the envelope offers no 96 or
                                     # 192 kHz Stream Input format (header)
  media_clock_sources: [internal, crf, input_stream] # INTERNAL 0, CRF 1, AAF listener k at 2 + k (#629)
  default_source: internal           # CLOCK_DOMAIN reset source
  crf_sink: true                     # CRF STREAM_INPUT media-clock sink
  crf_output:                        # Milan v1.2 7.2.3: two or more AAF
    enabled: true                    # inputs require a CRF Media Clock Output
    format: "0x041060010000BB80"     # Milan 7.3.2 Table 7.1 (CRF
                                     # AUDIO_SAMPLE, 48 kHz, interval 96,
                                     # 1 timestamp per PDU)
  audio_pll_hz: 24576000             # clean MMCM audio clock (MCLK = /2)

audio_interface:
  kind: i2s_philips                  # tdm8|tdm16|tdm32|i2s_philips|aes3|spdif
  word_length_bits: 24               # CS4344 24-bit Philips
  cluster_mapping:
    policy: cluster-per-stream-channel
    # cluster-count policy (USER decision, config-selectable):
    #   cluster-per-stream-channel - the stream's `clusters` field verbatim
    #     (the deployed ROM layout)
    #   cap-at-interface - min(clusters, physical interface channels):
    #     clusters model real endpoints only (wire truth)
    # Either way each cluster is mono MBLA; each stream owns ONE
    # STREAM_PORT + cluster block + AUDIO_MAP (port-relative offsets,
    # 1722.1-2021 7.2.19); physical interface channels bind in order to
    # the first clusters per direction; extra stream channels are virtual,
    # missing physical render 0 (USER wire-truth 1-to-1 rule).

streams:
  # Each listener is endstation_arty_split's: 8 clusters, the 2-channel 48 kHz
  # Base format current, and Milan v1.2 6.4's 48 kHz family derived after it
  # by the builder (base_format_complete). Each talker is its stereo framer,
  # with the wire-truth cluster count.
  listeners:
    - { name: "Stream In 0", channels: 8, clusters: 8, map_mode: dynamic, formats: ["0x0205022000806000"], buffer_length_ns: 2126000 }
    - { name: "Stream In 1", channels: 8, clusters: 8, map_mode: dynamic, formats: ["0x0205022000806000"], buffer_length_ns: 2126000 }
    - { name: "Stream In 2", channels: 8, clusters: 8, map_mode: dynamic, formats: ["0x0205022000806000"], buffer_length_ns: 2126000 }
    - { name: "Stream In 3", channels: 8, clusters: 8, map_mode: dynamic, formats: ["0x0205022000806000"], buffer_length_ns: 2126000 }
  talkers:
    - { name: "Stream Out 0", channels: 2, clusters: 2 }
    - { name: "Stream Out 1", channels: 2, clusters: 2 }
    - { name: "Stream Out 2", channels: 2, clusters: 2 }
    - { name: "Stream Out 3", channels: 2, clusters: 2 }

gptp:
  clock_accuracy: 0xFE              # IEEE 802.1AS-2011 8.6.2.3: unknown
  # The two latency corrections below are only reset values on this board:
  # CSR 0x540 and 0x544 move them at runtime, and 0x7F0 reads what is applied
  # (#829). The bench writes the compensation for an inline tap there and
  # never here (#878). The AX7101 leaves this key off.
  latency_writable: true
  # ONE source (USER 2026-08-05): these values generate the AVB_INTERFACE
  # descriptor's clock fields and the fabric uCPU image. priority1 248 =
  # the deferring Milan end-station default (see the AX7101 configs). The
  # fabric plane is the one product gPTP owner (#259)
  # configuration is generated from this section any more. The engine
  # consumes priority1 and this board's clock_accuracy (plus MAC and clock
  # frequency); other fields are derived or refused against the engine.
  # The Arty oscillator is not characterised, so its accuracy is unknown.
  priority1: 248
  priority2: 248
  clock_class: 248
  offset_scaled_log_variance: 0x436A
  domain: 0
  log_announce_interval: 0
  log_pdelay_interval: 0

  # THE BOARD'S TIMESTAMP LATENCY CORRECTIONS, nanoseconds (issue #358).
  # MANDATORY for every board whose gPTP plane is on; the method is in
  # docs/integration/BOARD_PORTING_AX7101.md.
  #
  # THIS BOARD'S PAIR (#829). An inline tap on the link compared the Pdelay
  # turnaround on the wire with the t3 - t2 this board claims, against the
  # bench switch on the same tap: a sum of 1509 ns, and direct to the switch
  # the peer delay read 752 ns, the same sum. THE SUM IS MEASURED, THE SPLIT
  # IS NOT: egress takes the DP83848's 100BASE-TX figures, one 40 ns MII
  # clock to the PHY's sampling edge and 6 bit times to the wire, and ingress
  # the rest. The measurement used an 80 MHz system clock, and two of its
  # ingress terms cross into sys, so at this image's 100 MHz the pair needs
  # measuring again on the board (#878 read a 1,465 ns sum at a 100 MHz sys
  # on an earlier image). Until then this keeps the 80 MHz calibration.
  ingress_latency_ns: 1409
  egress_latency_ns: 100
