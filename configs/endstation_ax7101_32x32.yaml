    - { name: "Stream Out 17", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 18", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 19", channels: 8, map_mode: dynamic, clusters: 2 }
