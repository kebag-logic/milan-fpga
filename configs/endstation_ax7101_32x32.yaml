    - { name: "Stream In 29", channels: 8, map_mode: dynamic }
    - { name: "Stream In 30", channels: 8, map_mode: dynamic }
    - { name: "Stream In 31", channels: 8, map_mode: dynamic }
  talkers:
    - { name: "Stream Out 0", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 1", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 2", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 3", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 4", channels: 8, map_mode: dynamic, clusters: 2 }
