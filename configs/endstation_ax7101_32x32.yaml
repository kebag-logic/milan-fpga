    - { name: "Stream Out 12", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 13", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 14", channels: 8, map_mode: dynamic, clusters: 2 }
    - { name: "Stream Out 15", channels: 8, map_mode: dynamic, clusters: 2 }
