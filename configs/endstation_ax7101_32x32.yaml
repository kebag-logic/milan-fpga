    - { name: "Stream In 23", channels: 8, map_mode: dynamic }
    - { name: "Stream In 24", channels: 8, map_mode: dynamic }
    - { name: "Stream In 25", channels: 8, map_mode: dynamic }
    - { name: "Stream In 26", channels: 8, map_mode: dynamic }
    - { name: "Stream In 27", channels: 8, map_mode: dynamic }
