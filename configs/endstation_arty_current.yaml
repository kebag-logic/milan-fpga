#
# Software-defined Milan End-Station config (gaps attack item 4).
# Shape: TODAY'S REAL ARTY BUILD - 1 AAF listener + CRF sink + 1 AAF talker,
# Philips-stereo I2S render on the Pmod I2S2 (CS4344). The builder gates
# assert that this config emits exactly the design flags of
# sw/litex/sweep.sh (arty OPTS + BASE) and that its AEM overlay, consumed by
# avdecc/gen_aem_store.py --overlay, reproduces the tracked
# hdl/ieee17221/aecp/gen/aecp_aem_rom.svh BYTE-IDENTICALLY.
#
# Schema (normative for v1.1): every key below; optional keys carry their
# defaults in sw/builder/endstation_builder.py.

schema: kebag-logic/milan-endstation-config
schema_version: "1.1.0"

entity:
  name: "Milan FPGA Talker"          # AEM ENTITY object_name (<=63 bytes)
  entity_model_id: hash-derived      # default path: EUI-64 from the model
                                     # shape (sha256 of the canonical shape
                                     # JSON, top 8 bytes folded under the
                                     # 00-1B-C5 OUI prefix - exact recipe in
                                     # sw/builder/README-parameters.md)
  model_id_pin: "0x001BC50AC1000002" # PINNED: the CURRENTLY DEPLOYED model
                                     # id - already-flashed silicon must not
                                     # change identity when the hash recipe
                                     # or shape serialization evolves.
                                     # Remove the pin only with a model-
                                     # changing reflash.
                                     # ...0001 -> ...0002 on 2026-08-13: the
                                     # descriptor byte layout moved from
                                     # 1722.1-2013 to -2021 (see
                                     # AEM_LAYOUT_REV). 6.2.2.8 requires a new
                                     # id for a changed model, and a pin that
                                     # outlives the change is exactly the
                                     # stale-controller-cache bug the pin is
                                     # otherwise there to prevent.
  entity_id: mac-derived             # EUI-64 from station MAC (MAC48->FF-FE)
  vendor_name: "Kebag Logic"
  # NO firmware_version KEY - it is DERIVED, not declared. The version lives
  # in hdl/common/csr/milan_csr.sv's `parameter logic [31:0] VERSION` (the
  # read-only 0x004 register, whose //! comment IS the gateware changelog),
  # and the ENTITY descriptor renders it as major.minor.rev:
  # [31:16].[15:0].firmware_rev, so 0x0001_0016 -> "1.22.0". Until
  # 2026-07-28 this key said "0.1.0" in all three configs while the fabric
  # was at 0x0001_0016, so every board we ship told Hive - and every other
  # controller on the segment - that it ran firmware 0.1.0. Same shape as
  # the ADP shape defect: a hand-typed declaration nothing could compare
  # against the fabric. The builder now refuses the key rather than
  # preferring one of two answers; `firmware_rev: N` (optional, default 0)
  # is the lever for a respin that changes no CSR ABI.
  serial_number: "AX7101-0001"       # deployed-ROM truth: the serial baked
                                     # into the shared AEM ROM image (both
                                     # boards; per-board identity rides the
                                     # runtime ENT_NAME8 CSR overlay).
                                     # Byte-identity gate pins this value.
  group_name: ""

board:
  target: arty                       # arty | ax7101
  constraints:                       # physical facts -> milan_soc.py argv
    sys_clk_hz: 83333000             # 83.333e6: the DDR3-666 window
    milan_clk_hz: 50000000           # dense datapath in its own 50 MHz domain
    l2_bytes: 65536
    phy: mii-100                     # DP83848 MII (arty) | gmii-1g (ax7101)
    gtx_tx_invert: false             # GMII-only knob (ax7101)
    floorplan: false
    flashboot: full                  # none | kernel | full (N25Q128 QSPI)
    uart_baudrate: 115200
    rx_queues: 2                     # ingress fan-out. Since 2026-07-26 the
                                     # split is gPTP (q1) vs everything else
                                     # (q0), NOT the old TCP 4-tuple flow hash
                                     # - docs/reference/EGRESS_QUEUE_MAP.md.
                                     # Per-board on purpose: the deployed arty
                                     # gateware carries rx1_* + steer_q0/q1 in
                                     # its csr.csv, so 2 is ITS boot-chain
                                     # layout (the ax8x8 shape still ships 1 -
                                     # see that config; never unify blindly)
    hs_page_bytes: 16384             # STRICT pair with kl-eth hsplit12
    strip_probes: true               # area-70 ship diet
    num_queues: 5                    # 802.1Q shaper queues =
                                     # ethernet_packet_pkg::NUMBER_OF_QUEUES
                                     # (q5 class A .. q0 best effort - see
                                     # docs/reference/EGRESS_QUEUE_MAP.md)
    # eth_port: only for multi-PHY boards (ax7101 e1|e2); arty has one PHY

srp:                                 # lwSRP (802.1Q MSRP/MVRP) reservation
                                     # table -> CSR 0x680 group. Every value
                                     # here is the DEPLOYED reset word; the
                                     # builder gates 18a/18b parse
                                     # hdl/common/csr/milan_csr.sv and
                                     # hdl/ieee8021q/srp/lwsrp_pkg.sv and
                                     # assert the emission matches, so a hand
                                     # edit on either side fails the build.
  sr_class: A                        # Milan v1.2 5.6: class A only
  vid: 2                             # THE SR VID (VID 0 floods unshaped)
  stream_dmac_base: "0x91E0F000FE01" # MAAP range 91:E0:F0:00:FE:01
  accumulated_latency_ns: 0          # constant until measured
  class_queue: 4                     # LWSRP_CTRL[4:2], reset PCP3->TC3->q4
                                     # (802.1Q order: q5 = SR class A, the
                                     # top of the 6-queue egress map)
  enable_at_reset: false             # LWSRP_CTRL[0]
  talker_declare_at_reset: false     # LWSRP_CTRL[1]
  bandwidth_limit_pct: 75            # Milan 5.6 / 802.1Q 34.3.1
  # MILAN v1.2 4.2.7.1.1 Table 4.3 supersedes 802.1Q Table 10-7 for a PAAD:
  # LeaveTime 5000 ms, not 600. These words are emitted into the generated CSR
  # defaults and programmed into the engine, so a stale 600 here would undo
  # the RTL reset the MRP timer round corrected.
  timers_ms: { join: 200, leave: 5000, leaveall: 10000 }
  tspec:
    policy: derived                  # pinned 224 until 2026-07-28: a
                                     # hand-picked "conservative" value that
                                     # over-reserved the 2ch stream ~3x and
                                     # contradicted 802.1Q 35.2.2.8.4 a) -
                                     # MaxFrameSize is "the maximum frame
                                     # size that the Talker WILL PRODUCE",
                                     # and this talker produces the 90-byte
                                     # wire frame (MSDU 72, tap-measured).
                                     # The pin's only stated reason was
                                     # "changing it needs a reflash"; this
                                     # round's reflash carries it. derived
                                     # follows the WIRE constant
                                     # (framer_wire_channels) end to end.
    max_frame_bytes: 224             # LWSRP_TSPEC[15:0]
    interval_frames: 1               # LWSRP_TSPEC[31:16]
  rtl_table: true                    # THIS config owns the tracked
                                     # hdl/ieee8021q/srp/gen/lwsrp_table.svh
                                     # (the deployed gateware's table)

platform:                            # device tree + driver-visible layout
  csr_base: 0x90000000               # AXI-Lite Milan CSR window
  mac_address: "02:00:00:00:00:02"   # board 2 - MUST differ from the AX7101's
                                     # ..:01 on the shared AVB switch
  interrupt: 3                       # constant,milan_interrupt from csr.csv
  boot_chain_pin:                    # the FLASHED boot chain's window map.
                                     # rx_queues moves every window from
                                     # dma-ts on by 0x74; a config that
                                     # contradicts these addresses is
                                     # REFUSED (the 5ce9a13 CSR-rot rule).
    dma-ts: 0xf0003100
    pcm-dma: 0xf0003120

clocking:
  sampling_rate_hz: 48000            # current media clock (AAF base rate)
  audio_unit_rates_hz: [48000, 96000, 192000]  # AUDIO_UNIT advertisement
                                     # (today's ROM: RATES 48/96/192)
  media_clock_sources: [internal, input_stream, crf]
  default_source: internal           # CLOCK_DOMAIN reset source
  crf_sink: true                     # CRF STREAM_INPUT media-clock sink
  audio_pll_hz: 24576000             # clean MMCM audio clock (MCLK = /2)

audio_interface:
  kind: i2s_philips                  # tdm8|tdm16|tdm32|i2s_philips|aes3|spdif
  word_length_bits: 24               # CS4344 24-bit Philips
  cluster_mapping:
    policy: cluster-per-stream-channel
    # cluster-count policy (USER decision, config-selectable):
    #   cluster-per-stream-channel - the stream's `clusters` field verbatim
    #     (legacy/pipewire-reference layout; what the deployed ROM ships)
    #   cap-at-interface - min(clusters, physical interface channels):
    #     clusters model real endpoints only (wire truth)
    # Either way each cluster is mono MBLA; each stream owns ONE
    # STREAM_PORT + cluster block + AUDIO_MAP (port-relative offsets,
    # 1722.1-2021 7.2.19); physical interface channels bind in order to
    # the first clusters per direction; extra stream channels are virtual,
    # missing physical render 0 (USER wire-truth 1-to-1 rule).

streams:
  listeners:
    - name: "Stream 1"               # AAF STREAM_INPUT 0 (CRF appended after)
      channels: 8                    # up-to-8 Milan 6.4 family
      formats: ["0x0205022000806000", "0x0215022002006000"]
      # 2ch-first reset default + ut-bit 1..8ch family entry (gen_aem_store)
      buffer_length_ns: 2126000
      clusters: 8
  talkers:
    - name: "Stream Output 0"
      channels: 2                    # talker truth: stereo framer
      formats: ["0x0205022000806000"]
      clusters: 8                    # legacy-8: today's DEPLOYED ROM keeps 8
                                     # output clusters (pipewire reference
                                     # layout); `clusters` is the single
                                     # authority - new shapes ship the
                                     # wire-truth value instead (see the
                                     # 4x4/8x8 examples)
