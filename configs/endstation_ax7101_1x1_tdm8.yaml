#
# Software-defined Milan End-Station config (USER 2026-08-05).
# Shape: AX7101 1x1x8 TDM8 - ONE 8-channel AAF listener stream + ONE
# 8-channel AAF talker stream, the 7.1 channel order [FL FR FC LFE RL RR
# SL SR] named through `channel_names` (a PARAMETER, not a hardcode), physical
# TDM8 capture, and the 8-channel TDM8 loopback lane. Linux host clusters,
# PCM rings and playback are absent in the shipping bare-metal profile.
#
# Simplifications this shape buys (all measured pains of the 8x8):
#   - one stream per direction => a mapping can never name a foreign
#     stream (the cross-stream BAD_ARGUMENTS class vanishes);
#   - loopback clusters are backed => mappings select live media instead of
#     the protocol-visible, fabric-disabled behavior of lane-off shapes;
#   - no secondary-network indices => every stream is cabled.

schema: kebag-logic/milan-endstation-config
schema_version: "1.1.0"

entity:
  name: "Milan FPGA 1x1 TDM8"
  entity_model_id: hash-derived      # shape change -> NEW id, so a cached
                                     # controller model (la_avdecc caches by
                                     # entity_model_id) can never show this
                                     # build another shape's ports
  entity_id: mac-derived
  vendor_name: "Kebag Logic"
  serial_number: "AX7101-0001"
  group_name: ""

board:
  target: ax7101
  features:
    fabric_gptp: true   # #114 plane, product default since #116 (kept explicit)
    sound_card: false    # retired surface (#259): no Linux ALSA host rings
    i2s_playback: false   # the AX routes NO audio pads (_connectors = [])
    latency_taps: true    # item-11 telemetry: at 1x1 the taps fit with room
                          # to spare, and the 0.44% stress-late residue wants
                          # a taps build on silicon
    render_lpf: false     # dependency of i2s_playback: false
    datapath_probes: true # APRB/PBK diagnostics back on - the 8x8 pruned
                          # them for area; this shape has the headroom
  constraints:
    sys_clk_hz: 100000000
    milan_clk_hz: 50000000   # 64-bit plane still carries 3.2 Gb/s; the
                              # option-on fabric and cacheless CPU close here
    l2_bytes: 0      # cacheless RV32I bare-metal core; no L1/L2/MMU
    phy: gmii-1g
    gtx_tx_invert: true
    floorplan: true
    flashboot: baremetal
    uart_baudrate: 115200
    rx_queues: 2
    hs_page_bytes: 16384
    strip_probes: true
    num_queues: 5
    eth_port: e1
    render_lpf: false

srp:
  sr_class: A
  vid: 2
  stream_dmac_base: "0x91E0F000FE01"
  class_queue: 4
  bandwidth_limit_pct: 75
  tspec:
    policy: derived                  # 8ch -> 216 B AVTPDU -> 16.512 Mb/s +
                                     # the CRF row's Table 4.4 numbers
    interval_frames: 1

platform:
  csr_base: 0x90000000
  mac_address: "02:00:00:00:00:01"   # board 1
  interrupt: 3
  pcm_ring_phys: 0x7f800000          # sound_card=false emits no PCM region;
  pcm_ring_bytes: 0x100000           # this boundary anchors the 1 MiB PP
  pcm_ring_stride: 0x100000          # window immediately below 0x7f800000
  boot_chain_pin:                    # re-verify against the BUILD's csr.csv
    dma-ts: 0xf0003100               # at flash time (8.2 checklist) - the

soc:
  software_profile: baremetal
  xlen: 32
  scala_args: []

gptp:
  # ONE source (USER 2026-08-05): these values generate BOTH the
  # AVB_INTERFACE descriptor's clock fields and /etc/gptp.<board>.cfg.
  # priority1 248 = the Milan end-station DEFAULT: the device DEFERS rather
  # than contesting the grandmaster role (Milan es-1.1 compliance posture is
  # 246|248, and 248 is the deferring end of it). The older 238 "AX bench
  # posture" deliberately BEAT the switch's 246 claim so the board would win
  # the BMCA - useful for a bring-up bench, wrong for a shipping end station
  # and wrong for a compliance run. Change HERE, nowhere else. The rest are
  # the local-clock dataset the fabric gPTP engine announces from constants
  # in gptp-processor/hdl/ucode/gen_gptp_ucode.py; the builder refuses any
  # stated value the engine does not announce ([R-parallel] on #228). The
  # old offset_scaled_log_variance 0xFFFF never went out on the wire (the
  # engine announces 0x436A), so the key is deleted and derived.
  priority1: 248
  priority2: 248
  clock_class: 248
  clock_accuracy: 0xFE
  domain: 0
  log_sync_interval: -3
  log_announce_interval: 0
  log_pdelay_interval: 0

clocking:
  sampling_rate_hz: 48000
  audio_unit_rates_hz: [48000]
  media_clock_sources: [internal, input_stream, crf]
  default_source: internal
  crf_sink: true
  crf_output:                        # one AAF media input makes the Milan
    enabled: true                    # 7.2.3 CRF Media Clock Output optional,
                                     # not forbidden - the bench media-clock
                                     # chain (M-CLK-2, class-A CRF budget)
                                     # stays as proven on the 8x8
    format: "0x041060010000BB80"
  audio_pll_hz: 24576000

audio_interface:
  kind: tdm8                         # 8 slots per direction = 4 pairs, the
                                     # user's shape. MASTER role - the fabric
                                     # generates bclk/fsync, so the front-end
                                     # is real without a codec behind it.
  word_length_bits: 24
  physical_channels:                 # WHAT THE BOARD ACTUALLY ROUTES.
    capture: 8                       # the TDM8 bus on J11.3-J11.8, driven as
                                     # bus MASTER, so the front end is real
                                     # with or without a codec behind it.
                                     # Was 0 on the grounds that "the AX7101
                                     # routes NOTHING (_connectors = [])" -
                                     # true before the item-4 J11 header, and
                                     # false since. BACKED as of 0x0042:
                                     # milan_datapath feeds the crossbar's
                                     # SLOT-INDEXED bucket (.tdm_pair_valid_i,
                                     # tied to 1'b0 until then) and the
                                     # builder emits a uniform src=2,
                                     # idx=ch/2, so all four pair slots reach
                                     # a cluster instead of collapsing onto
                                     # the single-pair I2S hold.
    render: 0                        # STILL 0, and NOT an oversight. Three
                                     # things must land first:
                                     #  (1) KL_tdm_render is a bus SLAVE - its
                                     #      serializer runs on posedge
                                     #      tdm_bclk_i, and a MASTER build
                                     #      ties tdm_bclk_i/tdm_fsync_i to 0
                                     #      (milan_soc.py:751), so the clock
                                     #      is constant zero and tdm_dout_o
                                     #      never leaves reset. There is no
                                     #      KL_tdm_render_master sibling; the
                                     #      capture side got one, render did
                                     #      not.
                                     #  (2) CHMAP_PHYS_C = 10 bakes the blend
                                     #      layout (2 I2S + 8 TDM) into the
                                     #      fabric, so phys 0/1 render into a
                                     #      DAC this shape prunes.
  channel_names: [FL, FR, FC, LFE, RL, RR, SL, SR]
                                     # USER 2026-08-05: the 7.1 order, as a
                                     # PARAMETER. Names the physical clusters
                                     # verbatim and prefixes loopback clusters;
                                     # 1722.1-2021 6.2.2.8 excludes
                                     # object_name from the model shape, so
                                     # renaming never moves entity_model_id.
  cluster_mapping:
    policy: role-pools
    pools:
      pilot: true                    # one KL_tone_gen Pilot cluster on the
                                     # talker port - the standing tone-based
                                     # identity/THD+N test source
      loopback: 8                    # the 8 TDM8 loopback channels: the
                                     # received stream offered back to the
                                     # talker, same media-clock domain
    fabric:
      loopback_lane: true            # BACKED on this build: 4 pair holds at
                                     # 1x1 (the 8x8's 32-hold bucket cost
                                     # +2303 LUT and was refused; this shape
                                     # affords it, and the loopback clusters
                                     # above stop being model-only)

streams:
  listeners:
    # map_mode dynamic (Milan v1.2 5.3.3.9 shall). There is no physical
    # render or Linux host lane, so the Stream Port Input truthfully has zero
    # clusters and no AUDIO_MAP descriptor; the runtime map page remains one.
    # No `formats` list: the builder states the current format as the Milan
    # 6.2 Base format for `channels` at clocking.sampling_rate_hz
    # (0x0205022002006000 = AAF PCM32 48 kHz 8ch) and DERIVES 6.4's family
    # completion after it (0x0215022002006000, the 6.5 ut string covering
    # every Base channel count 1..8 at 48 kHz).
    - { name: "Stream In 0", channels: 8, map_mode: dynamic }
  talkers:
    # 8-channel talker, 8-channel format, and at THIS shape the framer's
    # 8-channel emission is the item-5 NxN talker already landed - the
    # declaration and the wire agree.
    #
    # NO family completion here, and that asymmetry with the Stream Input is
    # the clause: Milan v1.2 6.3 asks a Base Talker only for one Stream
    # Output advertising a Base format and then says "A PAAD-AE Base Talker
    # may advertise any Base Format that is reasonable for its
    # functionality", where 6.4 makes the family a SHALL for Stream Inputs.
    # A talker cannot honour a wider claim either: the implemented
    # SET_STREAM_FORMAT state path does not re-shape the fixed-width framer.
    - { name: "Stream Out 0", channels: 8, map_mode: dynamic }
