#
# Software-defined Milan End-Station config (gaps attack item 4).
# Shape: ARTY 4x4 - the item-5 NxN test shape for the small board. 4 AAF
# listener + 4 AAF talker streams, 4ch each, over the physical audio the ARTY
# ACTUALLY HAS. VALIDATES today; stream 2..4 contexts are marked "planned" in
# the build plan (item 5).
#
# THIS CONFIG DECLARED `kind: tdm8` UNTIL 2026-07-28 AND THE ARTY CANNOT BACK IT.
# The declaration was harmless only for as long as nothing acted on it. The
# moment the TDM MASTER front-end lands, `tdm_bus_wired()` answers a GLOBAL
# question ("can any SoC in this tree build a master?") and so turns true for
# EVERY board at once - and this config, on a board with no `tdm` resource,
# starts emitting `--audio-interface tdm8 --audio-interface-master`. That build:
#   (a) drives tdm bclk/fsync/dout into unconnected Signal()s and reads
#       tdm_data_i = 0, i.e. 8 channels of DIGITAL SILENCE; and
#   (b) rebinds o_i2s_mclk_o away from the Pmod I2S2 - milan_datapath routes the
#       TDM master's MCLK out of the I2S mclk pin - taking the CS5343 MCLK off
#       pmoda:4 (ball D13) and killing the ONE known-good audio path in this
#       project, the board-to-board analog loop in docs/findings/BENCH_TOPOLOGY.md.
# ORACLE (a board-resource fact, not a spec question - there is no clause to
# cite): the stock litex_boards Arty platform contains the string "tdm" ZERO
# times and declares no `tdm` resource, and milan_soc.py adds no TDM extension
# on the arty path. Its only audio extension is i2s_pmod_io("pmoda"), which
# consumes all eight pmoda pins (G13 B11 A11 D12 D13 B18 A18 K16).
# pmodb/pmodc/pmodd are 24 unclaimed LVCMOS33 pins, so a header COULD be routed -
# but no TDM8 device exists to plug into it (Digilent ships no TDM Pmod; the
# bench has none), so routing one would move the silence from a Signal() to a
# header pin and measure the same zero. Pins are therefore NOT assigned, and
# the interface is declared as what the board is: stereo I2S, the same kind
# endstation_arty_current.yaml ships - the config that streams to a Milan-
# validated reference device with zero unsupported-format frames, through that
# Pmod. Raising this board to a real multichannel front-end is item 4's TDM
# header subtask and needs HARDWARE, not a config edit.
# ENFORCEMENT: sw/litex/platforms/board_audio_routing.py refuses the build, and
# test_builder gates 24c/24d refuse the config; re-declaring tdm8 here fails
# both.

schema: kebag-logic/milan-endstation-config
schema_version: "1.1.0"

entity:
  name: "Milan FPGA 4x4"
  entity_model_id: hash-derived      # EUI-64 from the model shape (recipe in
                                     # sw/builder/README-parameters.md); same
                                     # shape -> same id, shape change -> new
                                     # id. No pin: nothing flashed with this
                                     # shape yet.
  entity_id: mac-derived
  vendor_name: "Kebag Logic"
  # NO firmware_version KEY: it is DERIVED from the gateware's own VERSION
  # parameter (hdl/common/csr/milan_csr.sv, the read-only 0x004 register) as
  # major.minor.rev, and declaring one here is refused by the builder.
  # Optional `firmware_rev: N` (default 0) bumps the third component for a
  # respin that changes no CSR ABI.
  serial_number: "ARTY-0001"
  group_name: ""

board:
  target: arty
  constraints:
    sys_clk_hz: 83333000
    milan_clk_hz: 50000000
    l2_bytes: 65536
    phy: mii-100
    gtx_tx_invert: false
    floorplan: false
    flashboot: full
    uart_baudrate: 115200
    rx_queues: 2
    hs_page_bytes: 16384
    strip_probes: true
    num_queues: 5

srp:
  sr_class: A
  vid: 2
  stream_dmac_base: "0x91E0F000FE01"
  class_queue: 4                     # 802.1Q order: q4 = SR class A
  bandwidth_limit_pct: 75
  tspec:
    policy: derived                  # 4ch -> MaxFrameSize 120 B ->
                                     # 10.368 Mb/s per stream; 4 streams =
                                     # 41.5 Mb/s = 55% of the 100 Mb/s port,
                                     # inside the 75% class-A ceiling
    interval_frames: 1

platform:
  csr_base: 0x90000000
  mac_address: "02:00:00:00:00:02"
  interrupt: 3
  pcm_ring_phys: 0x4fc00000          # 4 capture streams x 1 MiB stride: the
  pcm_ring_bytes: 0x400000           # no-map region grows with N (the 1 MiB
  pcm_ring_stride: 0x100000          # 1x1 region would be DMA-overrun)
  boot_chain_pin:                    # 2-queue arty map (same as the deployed
                                     # shape - this config keeps rx_queues 2)
    dma-ts: 0xf0003100
    pcm-dma: 0xf0003120

clocking:
  sampling_rate_hz: 48000
  audio_unit_rates_hz: [48000]       # honest advertisement: 48k render only
  media_clock_sources: [internal, input_stream, crf]
  default_source: internal
  crf_sink: true
  crf_output:                        # Milan 7.2.3 (MANDATORY here: >=2 AAF
    enabled: true                    # media inputs => CRF Media Clock Output;
                                     # the builder rejects the config without
                                     # it). Model half; RTL provisioning of
                                     # KL_crf_tx rides with item-5 NxN.
    format: "0x041060010000BB80"     # Milan 7.3.2 Table 7.1 (subtype 4 CRF,
                                     # type 1 AUDIO_SAMPLE, 48k, interval 96,
                                     # 1 ts/PDU)
  audio_pll_hz: 24576000             # Pmod I2S2: MCLK /2, SCLK /8 = 64 fs,
                                     # LRCK /512 = 48.000 kHz exactly
                                     # (docs/design/AUDIO_STREAMING.md)

audio_interface:
  kind: i2s_philips                  # tdm8|tdm16|tdm32|i2s_philips|aes3|spdif
                                     # The Arty routes ONE audio front-end: the
                                     # Pmod I2S2 on pmoda (CS5343 ADC + CS4344
                                     # DAC), stereo. See the header banner for
                                     # why tdm8 is not declarable here.
  word_length_bits: 24               # CS4344 24-bit Philips
  cluster_mapping:
    policy: cap-at-interface         # clusters model real endpoints only:
                                     # per stream min(clusters, 2 I2S channels)

streams:
  listeners:
    - { name: "Stream In 0", channels: 4, formats: ["0x0205022001006000", "0x0215022001006000"] }
    - { name: "Stream In 1", channels: 4, formats: ["0x0205022001006000", "0x0215022001006000"] }
    - { name: "Stream In 2", channels: 4, formats: ["0x0205022001006000", "0x0215022001006000"] }
    - { name: "Stream In 3", channels: 4, formats: ["0x0205022001006000", "0x0215022001006000"] }
    # 0x0205022001006000 = AAF PCM32 48k 4ch; 0x0215... = ut-bit 1..4 family
    # clusters default = channels (4 mono clusters per stream port)
  talkers:
    # clusters = the single authority for the talker's cluster count; ships
    # WIRE TRUTH 2 (today's framer RTL is stereo - only 2 physical channels
    # exist behind any talker stream until the item-5 NxN talker lands;
    # raise together with that RTL). The legacy-8 layout stays expressible
    # (see endstation_arty_current.yaml).
    - { name: "Stream Out 0", channels: 4, clusters: 2, formats: ["0x0205022001006000"] }
    - { name: "Stream Out 1", channels: 4, clusters: 2, formats: ["0x0205022001006000"] }
    - { name: "Stream Out 2", channels: 4, clusters: 2, formats: ["0x0205022001006000"] }
    - { name: "Stream Out 3", channels: 4, clusters: 2, formats: ["0x0205022001006000"] }
